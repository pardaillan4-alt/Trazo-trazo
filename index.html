/* Mesa de dibujo: la galería son hojas de bloc sobre una mesa con puntos de cuadrícula;
   el estudio es una hoja grande con el paso al lado. Lo único que grita es la línea roja. */
:root{
  --mesa:#EDF0F5; --mesa-2:#E2E6EE; --hoja:#FFFFFF; --hoja-2:#F5F7FA;
  --grafito:#1F2330; --grafito-2:#596074; --borde:#D3D8E3; --punto:rgba(31,35,48,.11);
  --trazo:#D63F1E; --trazo-tinta:#FFFFFF; --trazo-suave:#FCE6DF; --linea-roja:#EF5232;
  --guia:#2F63E0; --guia-suave:#E2EAFD;
  --amarillo:#FFC23A; --amarillo-tinta:#3A2A00;
  --hecho:#0F7F56; --hecho-suave:#DCF2E8;
  --sombra-hoja:0 1px 0 rgba(20,26,45,.06),0 10px 24px -14px rgba(20,26,45,.32);
  --sombra-flota:0 22px 48px -20px rgba(20,26,45,.5);
  --velo:rgba(14,17,26,.46);
  --logo-fondo:#1F2330; --logo-guia:#93B2FF;
  --cristal:rgba(237,240,245,.86);
  /* superficies que siempre son papel (el dibujo), en los dos temas */
  --papel:#FBFAF7; --papel-ctl:rgba(255,255,255,.95); --papel-ctl-tinta:#1F2330; --papel-ctl-borde:rgba(20,26,45,.16); --papel-ctl-on:#2F63E0;
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-texto:'Outfit','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --f-mano:'Nothing You Could Do','Bradley Hand','Segoe Print','Comic Sans MS',cursive;
  --t-xs:13px; --t-s:15px; --t-m:17px; --t-l:21px; --t-xl:26px; --t-2xl:33px;
  --r-hoja:6px; --r-panel:18px; --r-pill:999px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --mesa:#11141B; --mesa-2:#191D27; --hoja:#1B1F2A; --hoja-2:#232836;
    --grafito:#ECEFF6; --grafito-2:#A3AABC; --borde:#30364A; --punto:rgba(220,228,255,.065);
    --trazo:#FF6B4A; --trazo-tinta:#1B0A04; --trazo-suave:#3B2019; --linea-roja:#FF6B4A;
    --guia:#88A9FF; --guia-suave:#1E2A48;
    --amarillo:#FFD25E; --amarillo-tinta:#2E2200;
    --hecho:#45D3A0; --hecho-suave:#123629;
    --sombra-hoja:0 1px 0 rgba(0,0,0,.45),0 12px 28px -14px rgba(0,0,0,.75);
    --sombra-flota:0 22px 50px -18px rgba(0,0,0,.8);
    --velo:rgba(4,6,10,.66);
    --logo-fondo:#ECEFF6; --logo-guia:#2F63E0;
    --cristal:rgba(17,20,27,.84);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --mesa:#11141B; --mesa-2:#191D27; --hoja:#1B1F2A; --hoja-2:#232836;
  --grafito:#ECEFF6; --grafito-2:#A3AABC; --borde:#30364A; --punto:rgba(220,228,255,.065);
  --trazo:#FF6B4A; --trazo-tinta:#1B0A04; --trazo-suave:#3B2019; --linea-roja:#FF6B4A;
  --guia:#88A9FF; --guia-suave:#1E2A48;
  --amarillo:#FFD25E; --amarillo-tinta:#2E2200;
  --hecho:#45D3A0; --hecho-suave:#123629;
  --sombra-hoja:0 1px 0 rgba(0,0,0,.45),0 12px 28px -14px rgba(0,0,0,.75);
  --sombra-flota:0 22px 50px -18px rgba(0,0,0,.8);
  --velo:rgba(4,6,10,.66);
  --logo-fondo:#ECEFF6; --logo-guia:#2F63E0;
  --cristal:rgba(17,20,27,.84);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background-color:var(--mesa);color:var(--grafito);font:400 var(--t-m)/1.55 var(--f-texto);
  background-image:radial-gradient(var(--punto) 1.1px,transparent 1.4px);background-size:24px 24px;background-position:-11px -11px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:9;background:var(--mesa)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.015em;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit}
img{max-width:100%}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.solo-lectores{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--guia);outline-offset:3px;border-radius:8px}
svg.ic{width:20px;height:20px;flex:none;display:block}

/* ---------- marco y barra ---------- */
.marco{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;
  background:var(--cristal);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);border-bottom:1px solid transparent;transition:border-color .2s}
.barra-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.barra.con-borde{border-bottom-color:var(--borde)}
body.en-estudio .barra{display:none}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--grafito);margin-right:auto;border-radius:12px;padding:2px 4px 2px 0}
.logo{width:36px;height:36px;flex:none}
.lg-f{fill:var(--logo-fondo)}
.lg-g{stroke:var(--logo-guia)}
.marca-txt{font:700 21px/1 var(--f-display);letter-spacing:-.02em}
.barra-acc{display:flex;align-items:center;gap:6px}
.avance{display:flex;align-items:center;gap:8px;font-size:var(--t-s);color:var(--grafito-2);margin-right:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.avance .txt-c{display:none;font-weight:700;color:var(--grafito)}
.anillo{width:26px;height:26px;flex:none}
.anillo circle{fill:none;stroke-width:4}
.anillo .a-f{stroke:var(--mesa-2)}
.anillo .a-v{stroke:var(--hecho);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--borde);background:var(--hoja);color:var(--grafito);
  display:grid;place-items:center;flex:none;cursor:pointer;padding:0;transition:background .15s,color .15s,border-color .15s}
.ib:hover{border-color:var(--grafito-2)}
.ib[aria-pressed="false"]{color:var(--grafito-2);background:transparent}
.ib[aria-pressed="false"] .tachado{display:block}
.ib .tachado{display:none}
.ib:disabled{opacity:.4;cursor:default}

/* ---------- portada ---------- */
.portada{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(20px,4vw,48px) 8px}
.portada h1{font-size:clamp(38px,5.4vw,62px);line-height:1;letter-spacing:-.03em;max-width:12ch}
.lede{margin-top:16px;font-size:clamp(17px,1.6vw,19px);color:var(--grafito-2);max-width:46ch}
.acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:var(--r-pill);
  border:1.5px solid var(--trazo);background:var(--trazo);color:var(--trazo-tinta);font:700 var(--t-m)/1.1 var(--f-texto);cursor:pointer;text-decoration:none;
  transition:transform .12s ease,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--hoja);color:var(--grafito);border-color:var(--borde)}
.btn.sec:hover{border-color:var(--grafito-2);filter:none}
.btn:disabled{opacity:.45;cursor:default;filter:none;transform:none}
.seguir{margin-top:24px;display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;max-width:520px;
  background:var(--hoja);border:1px solid var(--borde);border-radius:var(--r-panel);padding:10px 12px 10px 10px;box-shadow:var(--sombra-hoja)}
.seguir img{width:72px;height:72px;object-fit:contain;background:var(--papel);border-radius:10px;display:block}
.seguir b{display:block;font:700 var(--t-m)/1.2 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seguir small{display:block;color:var(--grafito-2);font-size:var(--t-s);margin-top:2px}
.barrita{height:6px;border-radius:9px;background:var(--mesa-2);margin-top:8px;overflow:hidden}
.barrita i{display:block;height:100%;background:var(--trazo);border-radius:9px}
.seguir .btn{padding:10px 18px;min-height:44px}

.demo{position:relative;margin:0}
.demo-hoja{position:relative;background:var(--papel);border-radius:var(--r-hoja);box-shadow:var(--sombra-flota);overflow:hidden;aspect-ratio:400/223;transform:rotate(.6deg)}
.demo-hoja svg,.demo-hoja img{position:absolute;inset:0;width:100%;height:100%;display:block}
.demo-hoja img{object-fit:contain;background:var(--papel);transition:opacity .9s ease}
.demo-hoja img.fuera{opacity:0}
.demo figcaption{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:var(--t-s);color:var(--grafito-2);min-height:24px;padding-right:min(46%,230px)}
.demo figcaption b{color:var(--grafito);font-weight:700}
.demo-fase{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);font-size:var(--t-xs);font-weight:700;background:var(--trazo-suave);color:var(--trazo)}
.nota{position:absolute;right:4px;bottom:-16px;z-index:2;display:flex;align-items:flex-start;gap:4px;font:400 20px/1.05 var(--f-mano);color:var(--linea-roja);transform:rotate(-2deg);pointer-events:none}
.nota svg{width:44px;height:40px;flex:none;margin-top:-24px}
.nota span{max-width:21ch;text-align:left;padding-top:6px}

/* ---------- cómo funciona ---------- */
.como{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:clamp(28px,4vw,48px);padding:0;list-style:none;counter-reset:c}
.como li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:start;background:var(--hoja);border:1px solid var(--borde);border-radius:var(--r-panel);padding:14px 16px}
.como svg{width:48px;height:48px}
.como h3{font-size:var(--t-l);display:flex;gap:8px;align-items:baseline}
.como h3::before{counter-increment:c;content:counter(c);font:700 var(--t-s)/1 var(--f-texto);color:var(--grafito-2)}
.como p{margin-top:4px;font-size:var(--t-s);color:var(--grafito-2)}

/* ---------- galería ---------- */
.galeria{margin-top:clamp(36px,5vw,64px)}
.gal-cab{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 24px}
.gal-cab h2{font-size:clamp(28px,3.4vw,38px)}
.gal-cab h2 small{font:400 var(--t-m) var(--f-texto);color:var(--grafito-2);margin-left:10px;letter-spacing:0}
.buscar{position:relative;flex:0 1 320px;min-width:0}
.buscar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--grafito-2);pointer-events:none}
.buscar input{width:100%;min-height:46px;border-radius:var(--r-pill);border:1px solid var(--borde);background:var(--hoja);color:var(--grafito);
  font:400 var(--t-m) var(--f-texto);padding:10px 16px 10px 44px}
.buscar input::placeholder{color:var(--grafito-2)}
.filtros{display:flex;gap:8px;margin-top:16px;overflow-x:auto;scrollbar-width:none;padding:2px}
.filtros::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:var(--r-pill);border:1px solid var(--borde);
  background:var(--hoja);color:var(--grafito);font:700 var(--t-s) var(--f-texto);cursor:pointer}
.chip small{font-weight:400;color:var(--grafito-2)}
.chip[aria-pressed="true"]{background:var(--grafito);color:var(--mesa);border-color:var(--grafito)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.nivel{margin-top:clamp(32px,4vw,48px);content-visibility:auto;contain-intrinsic-size:auto 560px}
.nivel-cab{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--borde)}
.nivel-cab h3{font-size:var(--t-xl)}
.nivel-cab h3 span{color:var(--grafito-2);font-weight:700}
.nivel-cab p{color:var(--grafito-2);font-size:var(--t-s);flex:1 1 260px;min-width:0}
.medidor{display:inline-flex;gap:3px;align-items:flex-end;margin-bottom:6px}
.medidor i{width:6px;border-radius:2px 2px 1px 1px;background:var(--borde)}
.medidor i:nth-child(1){height:8px}.medidor i:nth-child(2){height:11px}.medidor i:nth-child(3){height:14px}.medidor i:nth-child(4){height:17px}.medidor i:nth-child(5){height:20px}
.medidor i.on{background:var(--trazo)}
.obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:28px 22px;margin-top:22px}
.obra{display:flex;flex-direction:column;gap:10px;min-width:0}
.abrir{display:flex;flex-direction:column;gap:10px;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit;border-radius:var(--r-hoja)}
.hojita{position:relative;display:block;aspect-ratio:1;max-width:100%;background:var(--papel);border-radius:var(--r-hoja);box-shadow:var(--sombra-hoja);
  transition:transform .2s ease,box-shadow .2s ease}
.hojita img{position:absolute;left:9%;top:9%;width:82%;height:82%;object-fit:contain;display:block}
.abrir:hover .hojita{transform:translateY(-4px) rotate(-.6deg);box-shadow:var(--sombra-flota)}
.sello{position:absolute;display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 7px;border-radius:var(--r-pill);font:700 12px/1.3 var(--f-texto)}
.sello.hecho{left:8px;top:8px;background:var(--hecho);color:var(--hoja)}
.sello.hecho svg{width:14px;height:14px}
.sello.nuevo{right:8px;top:8px;background:var(--amarillo);color:var(--amarillo-tinta);padding-left:9px}
.obra-tit{font:700 var(--t-m)/1.2 var(--f-display);letter-spacing:-.01em;min-height:2.4em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.obra-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:var(--t-xs);color:var(--grafito-2)}
.obra-meta span{display:inline-flex;align-items:center;gap:5px}
.obra-meta svg{width:15px;height:15px}
.medio{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);color:var(--grafito-2)}
.punto-medio{width:10px;height:10px;border-radius:50%;flex:none;background:#8A8F9C}
.punto-medio.color{background:conic-gradient(#F25F3F,#FFC23A,#3BB273,#2F63E0,#B05BD8,#F25F3F)}
.punto-medio.acuarela{background:radial-gradient(circle at 35% 35%,#9FD3F5,#4D8FD6)}
.versiones{display:inline-flex;align-self:flex-start;background:var(--mesa-2);border-radius:var(--r-pill);padding:3px;gap:2px}
.versiones button{border:0;background:transparent;color:var(--grafito-2);font:700 var(--t-xs)/1 var(--f-texto);padding:7px 11px;border-radius:var(--r-pill);cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:30px}
.versiones button[aria-pressed="true"]{background:var(--hoja);color:var(--grafito);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.vacio{margin-top:28px;padding:28px;border:1.5px dashed var(--borde);border-radius:var(--r-panel);text-align:center;color:var(--grafito-2)}
.vacio b{display:block;color:var(--grafito);font:700 var(--t-l) var(--f-display);margin-bottom:6px}
.pie{margin-top:72px;padding-top:20px;border-top:1px solid var(--borde);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;color:var(--grafito-2);font-size:var(--t-s)}

/* ---------- estudio ---------- */
body.en-estudio{overflow:hidden}
body.en-estudio .marco{display:none}
.estudio{position:fixed;inset:0;z-index:10;background-color:var(--mesa);background-image:radial-gradient(var(--punto) 1.1px,transparent 1.4px);background-size:24px 24px;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "lienzo" "panel";
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.e-top{grid-area:top;display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.e-tit{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.e-tit b{font:700 19px/1.15 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-tit span{font-size:var(--t-xs);color:var(--grafito-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-acc{display:flex;gap:6px}
.e-lienzo{grid-area:lienzo;container-type:size;display:flex;align-items:center;justify-content:center;padding:4px 12px 8px;min-height:0;min-width:0}
/* los controles de la animación van debajo del dibujo, para no tapar nada (los pies, el piso, las orillas) */
.hoja-ctl{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:100%}
.papel{position:relative;width:min(100cqw,calc((100cqh - var(--ctl-h,0px)) * var(--ar,1)));aspect-ratio:var(--ar,1);max-width:100%;background:var(--papel);border-radius:var(--r-hoja);
  box-shadow:var(--sombra-flota);overflow:hidden;touch-action:none}
.zoomer{position:relative;width:100%;height:100%;transform-origin:0 0;will-change:transform}
.zoomer svg{display:block;width:100%;height:100%}
.cargando{position:absolute;inset:0;display:grid;place-items:center;font:700 var(--t-s) var(--f-texto);color:#596074;pointer-events:none}
.cargando i{width:28px;height:28px;border-radius:50%;border:3px solid rgba(31,35,48,.14);border-top-color:#D63F1E;animation:gira .8s linear infinite;margin:0 auto 10px;display:block}
@keyframes gira{to{transform:rotate(360deg)}}
.ctl{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:100%;min-height:40px;z-index:2}
.zbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.cb{width:40px;height:40px;border-radius:50%;border:1px solid var(--papel-ctl-borde);background:var(--papel-ctl);color:var(--papel-ctl-tinta);
  display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 2px 8px rgba(20,26,45,.14)}
.cb svg{width:18px;height:18px}
.cb.on{background:var(--papel-ctl-on);color:var(--papel-ctl);border-color:var(--papel-ctl-on)}
.vel{display:inline-flex;background:var(--papel-ctl);border:1px solid var(--papel-ctl-borde);border-radius:var(--r-pill);padding:3px;box-shadow:0 2px 8px rgba(20,26,45,.14)}
.vel button{border:0;background:transparent;color:var(--papel-ctl-tinta);font:700 12px/1 var(--f-texto);padding:8px 10px;border-radius:var(--r-pill);cursor:pointer}
.vel button[aria-pressed="true"]{background:var(--papel-ctl-tinta);color:var(--papel-ctl)}
.e-panel{grid-area:panel;display:flex;flex-direction:column;gap:12px;min-height:0;padding:4px 12px 12px;overflow:auto}
.estudio{--ctl-h:48px;grid-template-rows:auto min(calc((100vw - 24px) / var(--ar,1) + 12px + var(--ctl-h)),56dvh) minmax(0,1fr)}
.mapa-caja{margin-top:auto}
.lista.oculta{display:none!important}
.paso{position:relative;background:var(--hoja);border:1px solid var(--borde);border-radius:var(--r-panel);padding:14px 16px 16px;overflow:auto;min-height:0;flex:0 0 auto;max-height:62%}
.paso .versiones{margin-bottom:12px}
.ver-top{margin-left:6px}
@media (max-width:600px){.ver-top{display:none}}
@media (min-width:601px){.paso .ver-paso{display:none}}
.paso-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:40px}
.fase{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font:700 var(--t-xs)/1.2 var(--f-texto)}
.fase i{width:8px;height:8px;border-radius:50%;background:currentColor}
.fase.guias{background:var(--guia-suave);color:var(--guia)}
.fase.lineas{background:var(--trazo-suave);color:var(--trazo)}
.fase.tono{background:var(--mesa-2);color:var(--grafito)}
.fase.tono.color i{background:conic-gradient(#F25F3F,#FFC23A,#3BB273,#2F63E0,#B05BD8,#F25F3F)}
.fase.final{background:var(--amarillo);color:var(--amarillo-tinta)}
.paso-n{font-size:var(--t-s);color:var(--grafito-2);font-variant-numeric:tabular-nums}
.ocultar{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;border:0;background:var(--mesa-2);color:var(--grafito);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .2s}
.ocultar svg{width:16px;height:16px}
.paso.min .ocultar{transform:rotate(180deg)}
.paso h2{font-size:clamp(21px,2.3vw,28px);margin:10px 0 6px}
.paso p{font-size:var(--t-m);max-width:60ch}
.paso.min p,.paso.min .mats{display:none}
.paso.min h2{margin-bottom:0}
.mats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mat{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 5px;border-radius:var(--r-pill);border:1px solid var(--borde);font-size:var(--t-s)}
.mat i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);flex:none}
.mat i.color{background:conic-gradient(#F25F3F,#FFC23A,#3BB273,#2F63E0,#B05BD8,#F25F3F)}
.mat.presion i{box-shadow:none;background:none;display:inline-flex;align-items:flex-end;gap:2px;width:auto;padding-left:5px}
.mat.presion i b{width:4px;border-radius:1px;background:var(--borde)}
.mat.presion i b.on{background:var(--grafito)}
.na{margin-bottom:10px;padding:8px 12px;border-radius:12px;background:var(--mesa-2);font-size:var(--t-s)}
.mapa-caja{flex:none}
.mapa{display:flex;gap:3px;align-items:center;height:22px}
.mapa button{flex:1 1 0;min-width:4px;height:10px;border:0;border-radius:3px;padding:0;cursor:pointer;background:var(--borde);transition:height .15s}
.mapa button:hover{height:16px}
.mapa button.guias.hecho{background:var(--guia)}
.mapa button.lineas.hecho{background:var(--linea-roja)}
.mapa button.tono.hecho{background:var(--grafito-2)}
.mapa button.final.hecho{background:var(--amarillo)}
.mapa button.ahora{height:20px;background:var(--grafito);box-shadow:0 0 0 2px var(--mesa),0 0 0 4px var(--grafito)}
.mapa-fases{display:flex;gap:3px;margin-top:4px;font-size:12px;color:var(--grafito-2);align-items:center}
.mapa-fases span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:clip}
.mapa-fases .ver-todos{display:none;margin-left:auto;flex:none;border:0;background:none;color:var(--guia);font:700 12px var(--f-texto);cursor:pointer;padding:4px 0 4px 8px}
.e-nav{display:flex;gap:8px;flex:none}
.e-nav .btn{flex:1;min-width:0;white-space:nowrap;padding-inline:16px}
.e-nav .btn.sec{flex:0 0 auto}
.e-nav .oir span{display:none}
.lista{display:flex;flex-direction:column;flex:1 1 0;min-height:0;background:var(--hoja);border:1px solid var(--borde);border-radius:var(--r-panel);overflow:hidden}
.lista h3{font:700 var(--t-s) var(--f-texto);padding:12px 16px 4px;color:var(--grafito-2);letter-spacing:0}
.lista .pasos-lista{overflow:auto;padding:4px 8px 10px}
.pasos-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pasos-lista .grupo{font:700 var(--t-xs)/1 var(--f-texto);color:var(--grafito-2);padding:14px 10px 6px}
.pasos-lista .grupo:first-child{padding-top:4px}
.pl{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) 18px;gap:10px;align-items:center;text-align:left;border:0;background:transparent;border-radius:12px;padding:8px 10px;cursor:pointer;color:var(--grafito)}
.pl:hover{background:var(--mesa-2)}
.pl .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--f-texto);background:var(--mesa-2);color:var(--grafito-2);font-variant-numeric:tabular-nums}
.pl .t{font-size:var(--t-s);line-height:1.3}
.pl .ok{color:var(--hecho);display:none}
.pl.hecho .ok{display:block}
.pl.hecho .t{color:var(--grafito-2)}
.pl.ahora{background:var(--hoja);box-shadow:inset 0 0 0 1.5px var(--grafito)}
.pl.ahora .n{background:var(--grafito);color:var(--hoja)}
.pl.ahora .t{font-weight:700}
@media (min-aspect-ratio:11/10) and (min-width:760px){
  .estudio{grid-template-columns:minmax(0,1fr) clamp(330px,32vw,420px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "lienzo panel"}
  .e-lienzo{padding:4px 8px 18px 18px}
  .e-panel{max-height:none;padding:4px 18px 18px 8px}
  .e-nav .oir span{display:inline}
}
.e-acc .angosto{display:none}
@media (max-width:600px){.e-acc .ancho{display:none}.e-acc .angosto{display:grid}}
@media (max-width:420px){
  .ib{width:40px;height:40px}
  .e-top{gap:6px;padding-inline:8px}
}
.estudio.sin-lista .mapa-fases .ver-todos{display:inline-flex;align-items:center;gap:5px}
.ver-todos svg{width:14px;height:14px}
/* modo enfoque: solo el dibujo; las instrucciones se oyen */
.enfoque-top,.enfoque-nav{display:none}
.estudio.enfoque{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"lienzo";background:var(--papel)}
.estudio.enfoque .e-top,.estudio.enfoque .e-panel{display:none}
.estudio.enfoque .e-lienzo{padding:calc(62px + env(safe-area-inset-top,0px)) 0 calc(80px + env(safe-area-inset-bottom,0px))}   /* el dibujo queda entre la barra de arriba y los botones de abajo */
.estudio.enfoque .papel{border-radius:0;box-shadow:none;width:min(100cqw,calc(100cqh * var(--ar,1)))}
.estudio.enfoque .enfoque-top{display:flex;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));right:calc(12px + env(safe-area-inset-right,0px));justify-content:space-between;align-items:center;z-index:3;pointer-events:none}
.estudio.enfoque .enfoque-top>*{pointer-events:auto}
.estudio.enfoque .enfoque-top span{font:700 var(--t-s) var(--f-texto);color:var(--papel-ctl-tinta);background:var(--papel-ctl);padding:9px 14px;border-radius:var(--r-pill);box-shadow:0 2px 8px rgba(20,26,45,.14)}
.estudio.enfoque .enfoque-nav{display:flex;gap:10px;position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3}
.estudio.enfoque .ctl{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3}
.estudio.enfoque .zbtns{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));z-index:3}
.cb.grande{width:56px;height:56px}
.cb.grande svg{width:24px;height:24px}
.cb.ir{background:var(--papel-ctl-tinta);color:var(--papel-ctl);border-color:var(--papel-ctl-tinta)}
@media (max-width:460px){.estudio.enfoque .ctl{bottom:calc(84px + env(safe-area-inset-bottom,0px))}.estudio.enfoque .e-lienzo{padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))}}

/* ---------- hojas (ajustes, materiales, pasos) ---------- */
.capa{position:fixed;inset:0;z-index:30;background:var(--velo);display:flex;align-items:flex-end;justify-content:center;animation:velo .2s ease both}
.capa.der{justify-content:flex-end;align-items:stretch}
.panel-hoja{background:var(--hoja);color:var(--grafito);width:min(560px,100%);max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--sombra-flota);animation:sube .26s cubic-bezier(.2,.8,.2,1) both}
@media (min-width:760px){
  .capa{align-items:center}
  .capa.der{align-items:stretch}
  .panel-hoja{border-radius:22px;max-height:min(760px,90dvh)}
  .capa.der .panel-hoja{border-radius:22px 0 0 22px;max-height:none;width:min(440px,100%);padding-top:calc(18px + env(safe-area-inset-top,0px));animation-name:entra}
}
@keyframes velo{from{opacity:0}}
@keyframes sube{from{transform:translateY(24px);opacity:0}}
@keyframes entra{from{transform:translateX(24px);opacity:0}}
.ph-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.ph-cab h2{font-size:var(--t-xl)}
.grupo-aj{padding:16px 0;border-top:1px solid var(--borde);display:grid;gap:12px}
.grupo-aj:first-of-type{border-top:0}
.grupo-aj h3{font:700 var(--t-m) var(--f-texto);letter-spacing:0}
.fila{display:flex;align-items:center;justify-content:space-between;gap:16px}
.fila label,.fila>span{font-size:var(--t-s);color:var(--grafito-2)}
.interruptor{position:relative;width:52px;height:30px;border-radius:var(--r-pill);border:0;background:var(--borde);cursor:pointer;padding:0;flex:none;transition:background .2s}
.interruptor::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--hoja);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.interruptor[aria-checked="true"]{background:var(--hecho)}
.interruptor[aria-checked="true"]::after{transform:translateX(22px)}
.segm{display:flex;background:var(--mesa-2);border-radius:var(--r-pill);padding:3px;gap:2px}
.segm button{flex:1;border:0;background:transparent;color:var(--grafito-2);font:700 var(--t-s)/1 var(--f-texto);padding:10px 12px;border-radius:var(--r-pill);cursor:pointer;min-height:40px}
.segm button[aria-pressed="true"]{background:var(--hoja);color:var(--grafito);box-shadow:0 1px 3px rgba(0,0,0,.14)}
select.campo,input[type=range].campo{width:100%}
select.campo{font:400 var(--t-s) var(--f-texto);padding:11px 12px;border-radius:12px;border:1px solid var(--borde);background:var(--hoja-2);color:var(--grafito)}
input[type=range].campo{accent-color:var(--trazo)}
.nota-aj{font-size:var(--t-xs);color:var(--grafito-2)}
.lista-mat{margin:4px 0 0;padding-left:20px;display:grid;gap:6px}
.consejos{margin:4px 0 0;padding-left:20px;display:grid;gap:6px}

/* ---------- festejo ---------- */
.festejo{position:fixed;inset:0;z-index:40;background:var(--velo);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:velo .25s ease both}
.festejo canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.f-caja{position:relative;width:min(520px,100%);max-height:100%;overflow:auto;background:var(--hoja);border-radius:24px;padding:22px;box-shadow:var(--sombra-flota);text-align:center;animation:sube .35s cubic-bezier(.2,.8,.2,1) both}
.f-hoja{background:var(--papel);border-radius:var(--r-hoja);box-shadow:var(--sombra-hoja);padding:10px;transform:rotate(-1.2deg);margin:4px auto 0;max-width:340px}
.f-hoja img{display:block;width:100%;height:auto;max-height:42dvh;object-fit:contain}
.f-mano{font:400 30px/1 var(--f-mano);color:var(--linea-roja);margin-top:18px;transform:rotate(-2deg)}
.f-caja h2{font-size:clamp(28px,6vw,38px);margin-top:4px}
.f-caja p{color:var(--grafito-2);margin-top:6px}
.f-acc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}

/* ---------- aviso ---------- */
.aviso{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:50;background:var(--grafito);color:var(--mesa);
  padding:10px 18px;border-radius:var(--r-pill);font:700 var(--t-s) var(--f-texto);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.aviso.ver{opacity:1;transform:translate(-50%,0)}

/* ---------- animación del trazo (motor de dibujo) ---------- */
.cv .draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .9s ease both}
@keyframes dr{0%{stroke-dashoffset:1;opacity:0}3%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.cv .pop{animation:pop .7s ease both}
@keyframes pop{from{opacity:0}to{opacity:1}}
#cv.paused,#cv.paused *{animation-play-state:paused!important}

@media (max-width:860px){
  .portada{grid-template-columns:minmax(0,1fr)}
  .demo{order:-1;margin-top:34px}
  .portada h1{max-width:14ch}
  .como{grid-template-columns:minmax(0,1fr)}
  .avance .txt{display:none}
  .avance .txt-c{display:inline}
}
@media (max-width:520px){
  .nota{display:none}
  .demo figcaption{padding-right:0}
  .obras{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
  .marca-txt{font-size:19px}
  .nota{font-size:18px}
  .seguir{grid-template-columns:60px minmax(0,1fr)}
  .seguir img{width:60px;height:60px}
  .seguir .btn{grid-column:1/-1}
  .buscar{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .cv .draw path{animation:none!important;stroke-dasharray:none;stroke-dashoffset:0}
  .demo-hoja{transform:none}
}
.estudio,.e-top,.e-panel,.ctl,.enfoque-nav,.enfoque-top{touch-action:manipulation}

<script>
/* Ayudas para armar formas: todo en un lienzo de 400 x 400 */
const f=n=>Math.round(n*10)/10;
const D=[];
const add=o=>D.push(o);
/* elipse (o círculo) con rotación opcional */
const E=(x,y,rx,ry=rx,a=0)=>{
  const t=a*Math.PI/180,dx=rx*Math.cos(t),dy=rx*Math.sin(t);
  return `M${f(x-dx)} ${f(y-dy)}A${rx} ${ry} ${a} 1 0 ${f(x+dx)} ${f(y+dy)}A${rx} ${ry} ${a} 1 0 ${f(x-dx)} ${f(y-dy)}Z`;
};
/* polígono, cerrado o abierto */
const P=(pts,close=true)=>'M'+pts.map(q=>f(q[0])+' '+f(q[1])).join('L')+(close?'Z':'');
/* rectángulo redondeado */
const RR=(x,y,w,h,r)=>`M${x+r} ${y}H${x+w-r}A${r} ${r} 0 0 1 ${x+w} ${y+r}V${y+h-r}A${r} ${r} 0 0 1 ${x+w-r} ${y+h}H${x+r}A${r} ${r} 0 0 1 ${x} ${y+h-r}V${y+r}A${r} ${r} 0 0 1 ${x+r} ${y}Z`;
/* curva suave que pasa por los puntos */
const S=(p,closed=true)=>{
  const n=p.length;
  const g=i=>closed?p[((i%n)+n)%n]:p[Math.max(0,Math.min(n-1,i))];
  let d='M'+f(p[0][0])+' '+f(p[0][1]);
  const m=closed?n:n-1;
  for(let i=0;i<m;i++){
    const a=g(i-1),b=g(i),c=g(i+1),e=g(i+2);
    d+=`C${f(b[0]+(c[0]-a[0])/6)} ${f(b[1]+(c[1]-a[1])/6)} ${f(c[0]-(e[0]-b[0])/6)} ${f(c[1]-(e[1]-b[1])/6)} ${f(c[0])} ${f(c[1])}`;
  }
  return d+(closed?'Z':'');
};
/* reflejo horizontal de una lista de puntos */
const MX=pts=>pts.map(q=>[400-q[0],q[1]]);
/* rayos alrededor de un centro */
const rays=(cx,cy,n,r1,r2,hw,close)=>{
  let d='';
  for(let i=0;i<n;i++){
    const t=i*2*Math.PI/n-Math.PI/2,a=t-hw,b=t+hw;
    d+=P([[cx+r1*Math.cos(a),cy+r1*Math.sin(a)],[cx+r2*Math.cos(t),cy+r2*Math.sin(t)],[cx+r1*Math.cos(b),cy+r1*Math.sin(b)]],close);
  }
  return d;
};
/* estrella de cuatro puntas */
const star=(x,y,r)=>P([[x,y-r],[x+r*.3,y-r*.3],[x+r,y],[x+r*.3,y+r*.3],[x,y+r],[x-r*.3,y+r*.3],[x-r,y],[x-r*.3,y-r*.3]]);
/* ola: n tramos de 40 de ancho */
const wave=(x,y,n)=>`M${x} ${y}q20 -16 40 0`+'t40 0'.repeat(n-1);
/* nube festoneada alrededor de una elipse */
const puff=(cx,cy,rx,ry,n,r)=>{
  const pt=k=>{const t=2*Math.PI*k/n-Math.PI/2;return [cx+rx*Math.cos(t),cy+ry*Math.sin(t)]};
  const p0=pt(0);let d=`M${f(p0[0])} ${f(p0[1])}`;
  for(let k=1;k<=n;k++){const q=pt(k%n);d+=`A${r} ${r} 0 0 1 ${f(q[0])} ${f(q[1])}`}
  return d+'Z';
};

/* Motor de dibujo: contornos, sombreado, pelo, hojas y luz */
const rng=s=>{let a=s>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}};
const hash=str=>{let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const mix=(a,b,t)=>{const x=hx(a),y=hx(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const f2=n=>Math.round(n*100)/100;
const GR='#22222a';

/* Tipos de región: len = trazos (pelo, rayas, hojas, pasto); soft = cuánto relleno suave lleva */
const KIND={
  fur:{len:[7,16],w:.75,cv:.3,dens:80,op:[.14,.4],jit:15,soft:.55,b:4},
  hatch:{len:[24,44],w:1,cv:.1,dens:20,op:[.14,.3],jit:5,soft:.3,b:6},
  leaf:{len:[3,8],w:2.2,cv:.2,dens:60,op:[.25,.5],jit:180,soft:.5,b:4},
  grass:{len:[12,28],w:1,cv:.35,dens:35,op:[.2,.45],jit:14,soft:.2,b:3,dir:-90},
  blade:{len:[60,160],w:1,cv:.3,dens:3,op:[.25,.6],jit:12,soft:0,b:0,dir:-90},
  stripe:{len:[7,13],w:1,cv:.25,dens:120,op:[.3,.6],jit:14,soft:.9,b:1.8},
  soft:{soft:1,b:5},
  solid:{soft:1,b:0},
  light:{soft:1,b:4},
  line:{}
};
const BLS=[1.5,3,5,8,12,18];
const blurId=b=>{if(!b||b<.8)return null;let best=BLS[0];for(const v of BLS)if(Math.abs(v-b)<Math.abs(best-b))best=v;return 'bl'+String(best).replace('.','_')};

/* geometría de una región */
function norm(r){
  if(r._n)return r._n;
  let d,poly=null,ell=null,bb,area;
  if(r.p){poly=r.p;d=S(r.p)}else if(r.q){poly=r.q;d=P(r.q)}else if(r.e){ell=r.e;d=E(...r.e)}else d=r.d;
  if(poly){
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,a=0;
    poly.forEach((p,i)=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);const q=poly[(i+1)%poly.length];a+=p[0]*q[1]-q[0]*p[1]});
    bb=[x0-4,y0-4,x1+4,y1+4];area=Math.abs(a)/2;
  }else if(ell){
    const m=Math.max(ell[2],ell[3]||ell[2]);
    bb=[ell[0]-m,ell[1]-m,ell[0]+m,ell[1]+m];area=Math.PI*ell[2]*(ell[3]||ell[2]);
  }else{bb=r.bb||[0,0,400,400];area=(bb[2]-bb[0])*(bb[3]-bb[1])*.5}
  return r._n={d,poly,ell,bb,area};
}
function inside(N,x,y){
  if(N.poly){
    const p=N.poly;let c=false;
    for(let i=0,j=p.length-1;i<p.length;j=i++){
      if(((p[i][1]>y)!==(p[j][1]>y))&&(x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c;
    }
    return c;
  }
  if(N.ell){
    const e=N.ell,rx=e[2],ry=e[3]||e[2],t=-(e[4]||0)*Math.PI/180,dx=x-e[0],dy=y-e[1];
    const u=dx*Math.cos(t)-dy*Math.sin(t),v=dx*Math.sin(t)+dy*Math.cos(t);
    return u*u/(rx*rx)+v*v/(ry*ry)<=1;
  }
  return true;
}
function angAt(dir,x,y){
  if(typeof dir==='number')return dir;
  if(typeof dir==='function')return dir(x,y);
  return Math.atan2(y-dir.c[1],x-dir.c[0])*180/Math.PI+(dir.a||0)+(dir.m==='tan'?90:0);
}
/* trazos: se generan una vez por región y se guardan */
/* un pelo o trazo que nace grueso y termina en punta, como el lápiz real */
const TAPER={fur:1,blade:1,grass:1,stripe:1};
const sliver=(x,y,dx,dy,cv,a,w)=>{
  const nx=-Math.sin(a),ny=Math.cos(a),h=w/2,cx=x+dx/2+nx*cv,cy=y+dy/2+ny*cv;
  return `M${f(x+nx*h)} ${f(y+ny*h)}Q${f(cx+nx*h*.55)} ${f(cy+ny*h*.55)} ${f(x+dx)} ${f(y+dy)}Q${f(cx-nx*h*.55)} ${f(cy-ny*h*.55)} ${f(x-nx*h)} ${f(y-ny*h)}Z`;
};
/* trazos: se generan una vez por región y se guardan; el pelo sale en mechones */
function strokes(r,seed,q,sw){
  sw=sw||1;
  const key=seed+'|'+q+'|'+sw;
  if(r._s&&r._s[key])return r._s[key];
  const o=Object.assign({},KIND[r.k],r),N=norm(r),tp=r.taper!=null?r.taper:TAPER[r.k];
  const cl=tp?(r.cl!=null?r.cl:(r.k==='fur'?3:1)):1;
  const n=Math.min(6000,Math.round(o.dens*(r.n||1)*N.area/1000*q/Math.max(1,cl*.7)*((r.form!=null?r.form:(r.k==='fur'&&r.nf&&!r.lt))?1.5:1)));
  const form=r.form!=null?r.form:(r.k==='fur'&&r.nf&&!r.lt);
  const fcx=(N.bb[0]+N.bb[2])/2,fcy=(N.bb[1]+N.bb[3])/2,frx=(N.bb[2]-N.bb[0])/2,fry=(N.bb[3]-N.bb[1])/2;
  const R=rng(seed),b=N.bb,out=['','',''],W=(r.w||KIND[r.k].w||1)*sw*(r.k==='fur'?1.05:1.7);
  for(let i=0;i<n;i++){
    let x,y,t=0,ok=false;
    if(o.k==='blade'){x=b[0]+R()*(b[2]-b[0]);y=b[3]-4-R()*10;ok=true}

    let i=0;
    const next=()=>{
      if(my!==speakId)return;
      if(i>=parts.length){duck(false);return}
      const t=parts[i],u=new SpeechSynthesisUtterance(t);
      if(v){u.voice=v;u.lang=v.lang}else u.lang='es-MX';
      const q=/\?$/.test(t),ex=/!$/.test(t);
      u.rate=Math.max(.6,Math.min(1.3,SND.rate*(.97+Math.random()*.06)*(i===0?.98:1)));
      u.pitch=1+(q?.06:0)+(ex?.04:0)+(Math.random()-.5)*.05;
      u.volume=1;
      u.onstart=()=>{if(my===speakId)duck(true)};
      u.onend=()=>{if(my!==speakId)return;i++;const gap=/[.!?]$/.test(t)?230+Math.random()*120:110;speakTimer=setTimeout(next,gap)};
      u.onerror=()=>{if(my===speakId)duck(false)};
      speechSynthesis.speak(u);
    };
    next();
  },90);
}

/* ---------- Música ---------- */
let AC=null,master,duckG,verb,musicOn=false,timer=0,nextChord=0,nextNote=0,chordI=0;
const NOTE=m=>440*Math.pow(2,(m-69)/12);
const MOODS={
  suave:{chords:[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,66]],scale:[72,74,76,79,81,84],len:7,pad:'sine',pl:'triangle',dens:.55,pv:.5},
  bosque:{chords:[[38,45,53,60],[36,43,50,57],[41,48,55,62],[38,45,52,60]],scale:[62,65,67,69,72,74],len:9,pad:'triangle',pl:'sine',dens:.4,pv:.55},
  piano:{chords:[[48,55,60,64],[43,50,59,62],[45,52,60,64],[41,48,57,60]],scale:[60,64,67,72,76,79],len:6,pad:'sine',pl:'triangle',dens:.8,pv:.8}
};
function initAudio(){
  if(AC)return true;
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return false;
  try{
    AC=new C();
    master=AC.createGain();master.gain.value=SND.vol*.55;
    duckG=AC.createGain();duckG.gain.value=1;
    verb=AC.createConvolver();
    const n=AC.sampleRate*3,buf=AC.createBuffer(2,n,AC.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}
    verb.buffer=buf;
    const wet=AC.createGain();wet.gain.value=.55;
    verb.connect(wet);wet.connect(duckG);
    master.connect(duckG);master.connect(verb);
    duckG.connect(AC.destination);
  }catch(e){AC=null;return false}
  return true;
}
function tone(m,t,dur,type,vol,att){
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type=type;o.frequency.value=NOTE(m);o.detune.value=(Math.random()-.5)*8;
  f.type='lowpass';f.frequency.value=type==='sine'?1800:1300;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(f);f.connect(g);g.connect(master);
  o.start(t);o.stop(t+dur+.1);
}
function tick(){
  if(!AC||!musicOn)return;
  const M=MOODS[SND.mood]||MOODS.suave,now=AC.currentTime;
  while(nextChord<now+1.5){
    const ch=M.chords[chordI++%M.chords.length];
    ch.forEach((m,i)=>tone(m,nextChord+i*.12,M.len+2,M.pad,.05,2.2));
    nextChord+=M.len;
  }
  while(nextNote<now+1.2){
    if(Math.random()<M.dens){
      const sc=M.scale,m=sc[(Math.random()*sc.length)|0];
      tone(m,nextNote,2.6,M.pl,.085*M.pv,.015);
    }
    nextNote+=.55+Math.random()*.9;
  }
}
function startMusic(){
  if(!SND.music||!initAudio())return;
  if(AC.state==='suspended')AC.resume();
  if(musicOn)return;
  musicOn=true;chordI=0;
  nextChord=nextNote=AC.currentTime+.2;
  tick();timer=setInterval(tick,300);
  master.gain.cancelScheduledValues(0);
  master.gain.setValueAtTime(0,AC.currentTime);
  master.gain.linearRampToValueAtTime(SND.vol*.55,AC.currentTime+2);
}
function stopMusic(){
  if(!AC||!musicOn)return;
  musicOn=false;clearInterval(timer);
  master.gain.cancelScheduledValues(0);
  master.gain.setTargetAtTime(0,AC.currentTime,.4);
}
function setVol(v){SND.vol=v;if(AC&&musicOn)master.gain.setTargetAtTime(v*.55,AC.currentTime,.1)}
function duck(on){if(AC)duckG.gain.setTargetAtTime(on?.3:1,AC.currentTime,.25)}
/* los navegadores solo dejan sonar tras un toque: arranca con el primero */
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,function f(){
  if(SND.music)startMusic();
  removeEventListener(ev,f);
},{once:false}));

  {n:'Fondo',b:2,d:'Los trazos sueltos del fondo, primero los más marcados.',l:'Y una mancha muy suave alrededor para dar ambiente.'}]});

PD({"id": "dloomis", "k": "loomis", "lvl": 5, "cat": "Personas", "name": "Retrato con el método Loomis", "time": "2 horas", "guia": "El método Loomis empieza con una pelota: dibuja un círculo suave. Es la parte de arriba de la cabeza, el cráneo.", "lines": [["La línea de las cejas y el lado", "Cruza el círculo con una línea acostada: ahí van las cejas. A la derecha, un óvalo delgado que corta el círculo: es el lado de la cabeza, porque está un poco girada."], ["La línea del centro y la mandíbula", "Baja una línea por el centro de la cara. Abajo del círculo marca la base de la nariz, y a la misma distancia más abajo, la barbilla. Une los lados del círculo con la barbilla: esa es la mandíbula. La cara queda en tres partes iguales."], ["La nariz", "Como en el video, empieza por la nariz, sobre la marca de abajo del círculo. Primero el lado de la nariz: una línea que baja desde la ceja y se curva hasta la aleta. Luego el orificio, como una pequeña ola, y la aleta del otro lado."], ["La boca", "Debajo de la nariz, la boca: primero la línea donde se juntan los labios, que sube un poquito en medio. Luego el labio de arriba, con su pequeña \"V\" en medio, y al final el labio de abajo."], ["La mandíbula y la barbilla", "Repasa la mandíbula sobre la guía: baja desde la oreja con una sola línea firme hasta la barbilla redonda."], ["El cuello y el hombro", "Debajo de la barbilla baja el cuello con dos líneas. Abajo, la curva grande del hombro, que sigue bajando hacia la izquierda por la orilla del pecho, y la línea del brazo que baja derecho."], ["El contorno de la cara", "Ahora el borde de la cara: del lado derecho, de la frente a la mejilla; del lado izquierdo, una línea que baja junto al pelo hasta la barbilla."], ["El cabello", "El cabello con líneas largas y sueltas, una por mechón, siguiendo cómo cae a los lados desde la raya de en medio."], ["Los ojos y las cejas", "Al final los ojos. Primero la abertura del ojo como una almendra: el párpado de arriba tapa un poquito el iris. Encima, la línea del pliegue del párpado. Adentro, el iris y la pupila. Las pestañas, una por una: arriba salen del borde del ojo hacia afuera, y abajo son cortitas, más en la orilla. Luego las cejas pelito por pelito, siguiendo hacia dónde va cada uno: junto a la nariz casi parados, y hacia la orilla cada vez más acostados."]], "tones": [{"n": "Cara", "b": 2, "d": "Ahora un poco de sombra, muy suave: alrededor de los ojos, a un lado de la nariz y debajo del labio.", "l": "Y unas rayitas finas en la mejilla de la sombra."}, {"n": "Cabello", "b": 2, "d": "El cabello: más líneas oscuras entre los mechones, cerca de la cara.", "l": "Y líneas suaves para los mechones claros."}, {"n": "Cuello", "b": 2, "d": "El cuello: la sombra debajo de la barbilla.", "l": "Y unas líneas suaves en el hombro."}], "fin": [["Repasa las líneas", "Por último, repasa las líneas más importantes para que se vean más firmes. Abajo está la firma de la artista que hizo este dibujo, Karin.", ["#4A4A55", "Lápiz 4B"]]]});

/* Jesús con la corona de espinas mirando arriba: método Loomis */
PD({"id": "despinas", "k": "espinas", "lvl": 5, "cat": "Personas", "name": "Jesús con la corona, mirando arriba", "time": "2 horas", "guia": "Con el método Loomis: dibuja una pelota grande en medio de la hoja. Es el cráneo. Esta vez la cabeza está echada hacia atrás, mirando al cielo.", "lines": [["La línea de las cejas y el lado", "Como mira hacia arriba, la línea de las cejas va inclinada, subiendo a la derecha. A la izquierda, un óvalo para el lado de la cabeza, donde va la oreja."], ["El centro, la mandíbula y el cuello", "La línea del centro baja en diagonal, porque la cara está girada. Marca la nariz y la barbilla, une la mandíbula, y baja dos líneas para el cuello."], ["La nariz", "Empieza por la nariz: se ve desde abajo, con los orificios bien marcados."], ["La boca", "Debajo, la boca entreabierta, entre el bigote."], ["El contorno de la cara", "El borde de la frente y la mejilla, donde da la luz."], ["Los ojos y las cejas", "El ojo mira hacia arriba, con las pestañas largas, y la ceja encima. El otro ojo casi no se ve."], ["La barba", "La barba con muchos trazos cortos, como rizos, desde la mejilla hasta abajo de la barbilla."], ["La oreja y el cuello", "La oreja pequeña a la izquierda, y el cuello estirado."], ["El cabello", "El cabello largo cae por detrás, en mechones."], ["La corona de espinas", "Por último, la corona: ramas que se enredan alrededor de la cabeza, con las espinas que salen hacia afuera."]], "tones": [{"n": "Cara", "b": 2, "d": "Ahora el sombreado: primero lo oscuro de la cara, el ojo, los orificios de la nariz y la boca.", "l": "Luego las sombras suaves de la mejilla."}, {"n": "Barba", "d": "La barba es muy oscura: rellena lo más negro, debajo de la barbilla.", "m": "Luego el tono medio, dejando rayitas blancas entre los rizos.", "l": "Y las puntas claras donde da la luz."}, {"n": "Cuello", "b": 2, "d": "El cuello: las sombras grises debajo de la barba.", "l": "Y difumina suave."}, {"n": "Cabello", "d": "El cabello: rellena lo más oscuro, casi negro.", "m": "Luego el tono medio entre los mechones.", "l": "Y deja líneas blancas de brillo."}, {"n": "Corona", "b": 2, "d": "La corona: repasa las ramas con lápiz muy oscuro.", "l": "Y afila las puntas de las espinas."}], "fin": [["Repasa las líneas", "Por último, repasa los negros y las líneas más firmes, como el contorno de la cara.", ["#4A4A55", "Lápiz 4B"]]]});

PD({"id": "dguadalupe", "k": "gua3", "h": 710, "lvl": 5, "cat": "Personas", "name": "Virgen de Guadalupe", "time": "2 horas", "artist": true, "guia": "Muy suave: un óvalo inclinado para la cara, porque la Virgen inclina la cabeza hacia la izquierda. Alrededor, un arco grande para el velo, y abajo un óvalo para las manos.", "lines": [["El contorno de la cara", "Sobre el óvalo, el borde de la cara: arriba donde empieza el pelo, la mejilla y la barbilla redonda."], ["Los ojos y las cejas", "Los ojos mirando hacia abajo, casi cerrados, con su párpado y el iris; arriba, las cejas finas."], ["La nariz y la boca", "La nariz larga con la curva de la punta, y la boca pequeña con sus dos labios."], ["El cabello", "El cabello largo con líneas que bajan a los dos lados de la cara, desde la raya de en medio."], ["El cuello y el broche", "El cuello, el cuello redondo de la túnica con su orilla, y el broche en medio."], ["El velo y el manto", "El velo que cubre la cabeza con su orilla, y el manto que cae por los lados hasta abajo."], ["Las manos", "Las manos juntas, rezando: cada dedo con su uña."], ["La túnica", "La túnica con sus flores en forma de remolino, y los puños de las mangas."], ["Las estrellas", "Sobre el manto, las estrellas de ocho picos."], ["Los rayos", "Por último, los rayos de sol: líneas rectas que salen de atrás hacia afuera."]], "tones": [{"n": "Cara y manos", "d": "Ahora el color: primero lo más oscuro de la piel, alrededor de los ojos, la nariz y entre los dedos.", "m": "Luego el tono medio de la cara, el cuello y las manos.", "l": "Y lo más clarito: la frente, la nariz y las mejillas donde da la luz."}, {"n": "Cabello", "d": "El cabello: casi negro, sobre todo junto a la cara.", "m": "Luego el tono medio.", "l": "Y unos brillos suaves."}, {"n": "Túnica", "d": "La túnica: primero las sombras rojas entre los pliegues y las flores.", "m": "Luego el color rosado de la túnica y los puños.", "l": "Y lo claro de los puños blancos."}, {"n": "Manto", "d": "El manto: primero lo azul oscuro y las orillas doradas.", "m": "Luego el azul verdoso del manto.", "l": "Y lo claro donde le da la luz."}, {"n": "Rayos", "d": "Los rayos: primero las líneas oscuras entre ellos.", "m": "Luego el dorado de cada rayo.", "l": "Y los brillos claros."}], "fin": [["Los últimos detalles", "Repasa lo más oscuro: los ojos, la boca y el cabello junto a la cara. Y pinta de dorado las estrellas."]]});

PD({"id": "dmedalla", "k": "medalla", "h": 533.333, "lvl": 5, "cat": "Personas", "name": "Virgen de la Medalla Milagrosa", "time": "3 horas", "guia": "Esta vez es una figura de cuerpo entero. Con el método Loomis, empieza por una pelota pequeña arriba para la cabeza. El cuerpo mide como ocho cabezas.", "lines": [["La línea de los ojos y el lado", "Cruza la pelota con la línea de los ojos y un óvalo delgado a la derecha."], ["El cuerpo y las medallas", "Baja una línea larga por el centro del cuerpo. Marca los hombros, la cintura, los brazos abiertos hacia las manos y la orilla del manto abajo. A los lados, dos óvalos para las medallas."], ["La nariz", "Empieza la cara por la nariz, pequeña, porque mira hacia arriba."], ["La boca", "La boca, pequeña y tranquila."], ["El contorno de la cara", "El borde de la cara, con el velo alrededor."], ["Los ojos", "Los ojos miran al cielo, y las cejas encima."], ["La aureola", "Alrededor de la cabeza, el círculo de la aureola."], ["El manto", "El manto que cae de la cabeza y se abre con los brazos, con sus pliegues grandes."], ["La túnica", "La túnica larga con el cinturón y los pliegues que bajan hasta los pies."], ["Las manos", "Las manos abiertas, con las palmas hacia arriba."], ["Las medallas", "Las dos medallas: de un lado la Virgen, del otro la M con la cruz, los dos corazones y las estrellas."], ["Las palomas", "Las palomas que vuelan alrededor."], ["Las nubes", "Por último, las nubes debajo de sus pies."]], "tones": [{"n": "Cara", "b": 2, "d": "Ahora el sombreado: primero los ojos, la nariz y la boca.", "l": "Luego un tono suave junto al velo."}, {"n": "Manto", "d": "El manto: primero lo más oscuro dentro de los pliegues.", "m": "Luego el tono medio de la tela.", "l": "Y difumina las partes de luz."}, {"n": "Túnica", "b": 2, "d": "La túnica es clara: solo las sombras de los pliegues.", "l": "Y un tono muy suave."}, {"n": "Manos", "b": 2, "d": "Las manos: las sombras entre los dedos.", "l": "Y un tono suave."}, {"n": "Medallas", "b": 2, "d": "Las medallas: repasa la M, la cruz y los corazones.", "l": "Y un tono suave en la figura de la Virgen."}, {"n": "Palomas", "b": 2, "d": "Las palomas: las sombras debajo de las alas.", "l": "Y deja las plumas blancas."}, {"n": "Nubes", "b": 2, "d": "Las nubes: un tono suave abajo.", "l": "Y difumina para que se vean esponjosas."}], "fin": [["Repasa las líneas", "Por último, repasa la cara, las manos y las orillas del manto.", ["#4A4A55", "Lápiz 4B"]]]});

PD({"id": "dojo", "k": "ojo", "h": 421.053, "lvl": 5, "cat": "Personas", "name": "Ojo realista al carboncillo", "time": "2 horas", "lap": {"dark": ["#2E2E36", "Carboncillo suave"], "mid": ["#6E6E7A", "Carboncillo medio"], "base": ["#B9B9C0", "Carboncillo duro"]}, "guia": "Como en el video, empieza con líneas muy suaves: la forma del ojo como una almendra, más puntiaguda en la esquina de adentro.", "lines": [["El iris y la pupila", "Dentro del ojo, un círculo grande para el iris. Fíjate: el párpado de arriba lo tapa un poquito. En medio, otro círculo para la pupila."], ["El pliegue y la ceja", "Arriba del ojo, una curva para el pliegue del párpado. Más arriba, la forma de la ceja, que baja hacia la orilla."], ["El contorno del ojo", "Repasa el borde del ojo y el grosor del párpado de abajo."], ["La orilla del iris", "Marca bien la orilla del iris. Deja sin tocar el lugar de los brillos: eso se ve en el video con el lápiz blanco."], ["La ceja", "Marca suave por dónde van los pelos de la ceja."]], "tones": [{"n": "Pupila", "b": 2, "d": "Como en el video, el sombreado empieza por la pupila con el carboncillo más oscuro, bien negra, sin tapar los brillos.", "l": "Luego difumina la orilla con un pincel suave."}, {"n": "Iris", "b": 2, "d": "El iris: rayitas que salen de la pupila hacia afuera, y la orilla del iris más oscura.", "l": "Difumina con el pincel chiquito, cuidando que el brillo quede blanco."}, {"n": "Blanco del ojo", "b": 2, "d": "El blanco del ojo no es blanco: con el pincel chiquito, una sombra suave arriba, debajo del párpado.", "l": "Y un tono muy ligero en las esquinas."}, {"n": "Párpados y piel", "d": "Con un pincel más grande, sombrea los párpados y alrededor del ojo: primero lo más oscuro, el pliegue y la ojera.", "m": "Luego el tono medio de la piel.", "l": "Y saca brillos suaves con la goma, en el párpado y debajo del ojo."}, {"n": "Ceja", "d": "La ceja, con el carboncillo suave: pelito por pelito, siguiendo la dirección del pelo.", "m": "Luego más pelos, unos encima de otros.", "l": "Y unos pelos claros con el lápiz blanco."}, {"n": "Pestañas", "b": 2, "d": "Al final, las pestañas de arriba: largas, curvas y en grupitos, salen de la orilla del párpado.", "l": "Y las de abajo, más cortas y finas."}], "fin": [["Brillos con la goma", "Por último, con la goma en punta, saca los brillos del ojo y del párpado de abajo, como en el video.", ["#F2F2F2", "Goma"]]]});

PD({"id": "dtortuga", "k": "tortuga", "h": 218.4, "lvl": 4, "cat": "Animales", "name": "Tortuga realista", "time": "2 horas", "lap": {"dark": ["#2E2E36", "Lápiz 8B"], "mid": ["#6E6E7A", "Lápiz 4B"], "base": ["#B9B9C0", "Lápiz 2B"]}, "guia": "Como en el video, empieza con un rectángulo grande, muy suave: ahí va a caber toda la tortuga.", "lines": [["El centro y la cabeza", "Divide el rectángulo con una línea parada y una acostada. A la derecha, un rectángulo pequeño: ahí va la cabeza."], ["Las formas del cuerpo", "Dentro, un óvalo grande para el caparazón, como media pelota, y unas líneas para las patas."], ["El ojo", "Empieza por el ojo, dentro del rectangulito: redondo, con su párpado."], ["La cabeza", "Alrededor del ojo, la cabeza con su boca y las escamitas."], ["El contorno del caparazón", "El borde del caparazón: redondo arriba y casi plano abajo."], ["Las placas", "Como en el video, el caparazón es como un balón de fútbol: dibuja las placas grandes de en medio y las de la orilla. Dentro de cada una, líneas que siguen su forma, como anillos."], ["El cuello y el cuerpo", "El cuello con sus arrugas y la parte de abajo del cuerpo."], ["Las patas", "Las patas con escamas redondas, como piedritas, y las uñas."]], "tones": [{"n": "Caparazón", "d": "Con el lápiz 8B, el más oscuro: rellena las líneas entre placa y placa.", "m": "Luego con el 4B, el tono medio de los anillos.", "l": "Y con el 2B, lo claro en el centro de cada placa."}, {"n": "Cabeza", "b": 2, "d": "La cabeza: el ojo bien negro, dejando un brillo, y las sombras de la boca.", "l": "Luego un tono suave en la piel, con escamitas."}, {"n": "Cuello y cuerpo", "b": 2, "d": "El cuello: las sombras de las arrugas.", "l": "Y un tono suave."}, {"n": "Patas", "d": "Las patas: primero lo oscuro entre las escamas.", "m": "Luego el tono medio en cada escama.", "l": "Y deja brillos en las escamas de arriba."}, {"n": "Sombra", "b": 2, "d": "Por último, la sombra en el piso, muy oscura debajo de la tortuga.", "l": "Y difumínala hacia afuera para que se vea que está parada."}], "fin": [["Repasa las líneas", "Para terminar, repasa las líneas más oscuras del caparazón y el ojo.", ["#2E2E36", "Lápiz 8B"]]]});

PD({"id": "dhalcon", "k": "halcon", "h": 761.905, "lvl": 4, "cat": "Animales", "name": "Halcón peregrino", "time": "2 horas", "guia": "Como en el video, empieza con una línea parada en medio de la hoja y un círculo arriba para la cabeza.", "lines": [["La cabeza y el cuerpo", "Cruza la cabeza con una línea para los ojos. Debajo, un óvalo grande y alargado para el cuerpo."], ["Las patas y la roca", "Abajo, una rayita para las patas y una línea inclinada para la roca. Y un trazo para el pico."], ["La cabeza", "Ahora el contorno de la cabeza, redonda arriba."], ["El ojo", "El ojo grande y redondo, con un anillo alrededor."], ["El pico", "El pico curvo, como un gancho, con su punta hacia abajo."], ["La máscara", "La mancha oscura debajo del ojo, como un bigote: es la marca del halcón peregrino."], ["Las alas", "Las dos alas a los lados, largas, con la orilla de las plumas."], ["El pecho", "El pecho con sus manchitas en forma de gota."], ["Las garras", "Las patas agarradas a la roca, con los dedos y las uñas curvas."], ["La roca", "Por último, la orilla de la roca."]], "tones": [{"n": "Cabeza", "d": "Como en el video, empieza el sombreado por la cabeza: la máscara y la parte de arriba, bien oscuras.", "m": "Luego el ojo, dejando el brillo blanco, y el pico.", "l": "Y la mejilla clara, casi blanca."}, {"n": "Alas", "d": "Las alas: primero lo más oscuro, la orilla y entre las plumas.", "m": "Luego el tono medio de las plumas.", "l": "Y difumina las partes de luz."}, {"n": "Pecho", "b": 2, "d": "El pecho: las manchitas oscuras, una por una.", "l": "Y una sombra suave a los lados."}, {"n": "Garras", "b": 2, "d": "Las garras: las uñas oscuras y las sombras entre los dedos.", "l": "Y un tono suave en los dedos."}, {"n": "Roca", "b": 2, "d": "La roca: un tono oscuro abajo.", "l": "Y difumina hacia arriba."}], "fin": [["Brillos con la goma", "Como en el video, saca brillos con la goma en el pecho, en el ojo y en la orilla de las alas.", ["#F2F2F2", "Goma"]]]});
