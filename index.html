 "El ala: primero las rayas negras de las plumas, bien marcadas, siguiendo su curva.", "m": "Luego el tono medio entre las rayas.", "l": "Y lo claro: las orillas de cada pluma quedan casi blancas."}, {"n": "Cuerpo", "d": "El cuerpo: trazos suaves que bajan, como plumas. Primero lo más oscuro, los lados y debajo del ala.", "m": "Luego el tono medio del pecho.", "l": "Y lo claro: la panza donde da la luz."}, {"n": "Patas", "b": 2, "d": "Las patas: primero las sombras entre los dedos y las uñas.", "l": "Luego un tono suave en los dedos."}, {"n": "Rama", "d": "La rama: trazos largos de lado a lado, como la veta de la madera. Primero las grietas oscuras y la sombra debajo de las patas.", "m": "Luego el tono medio de la corteza.", "l": "Y los brillos de arriba de la rama."}]});

/* Guacamayo: aprendido del video, con difuminado y goma */
PD({"id": "dguaca", "k": "guaca", "lvl": 5, "cat": "Animales", "name": "Guacamayo realista", "time": "2 horas", "guia": "Empieza muy suave, casi sin apretar: un círculo para la cabeza arriba a la derecha y un óvalo grande inclinado para el cuerpo, que baja hacia la izquierda. Una línea larga abajo marca la rama.", "lines": [["Contorno de la cabeza", "Sobre el círculo, dibuja el borde de la cabeza: la frente redonda y la nuca que baja. Nada adentro todavía."], ["El ojo", "Dentro de la cabeza, cerca del pico, el ojo: un círculo con la pupila en medio y otro círculo alrededor, como un anillo."], ["El pico", "El pico grande y curvo como un gancho: la parte de arriba baja y termina en punta. Abajo, la parte negra del pico, más chica."], ["La cara", "Alrededor del ojo, la zona de la cara sin plumas. Adentro, rayitas finas en filas: son plumitas diminutas."], ["El cuello y la espalda", "Desde la cabeza, baja la línea de la espalda hasta la cola larga, y del otro lado el pecho."], ["Las plumas del pecho", "En el pecho, plumitas pequeñas en forma de U, una junto a otra, como escamas."], ["Las plumas del ala", "Más abajo, las plumas del ala: más grandes y largas, en filas que bajan."], ["Las plumas largas", "Abajo y a la izquierda, las plumas largas de las alas y la cola, como hojas que apuntan hacia abajo."], ["La pata y la rama", "Por último, la pata agarrada a la rama, y la orilla de la rama con su musgo."]], "tones": [{"n": "Cara y ojo", "d": "Ahora el sombreado. Empieza por lo más oscuro del ojo: la pupila y el anillo, dejando un puntito blanco de brillo.", "m": "Luego repasa las rayitas de la cara.", "l": "Y lo claro: un tono muy suave en la piel de la cara."}, {"n": "Pico", "b": 2, "d": "El pico: primero lo oscuro, la parte negra de abajo.", "l": "Luego la parte de arriba: pasa un tono suave y difumínalo con un pañuelo, para que se vea liso."}, {"n": "Cabeza", "d": "La cabeza: trazos cortitos que salen del pico hacia atrás, como plumas. Primero lo más oscuro, la nuca y debajo del ojo.", "m": "Luego el tono medio de toda la cabeza.", "l": "Y para terminar la cabeza, pasa un tono suave y difumínalo con un pañuelo."}, {"n": "Pecho", "d": "El pecho: sombrea la parte de abajo de cada plumita en U, donde se encima con la siguiente.", "m": "Luego el tono medio del pecho.", "l": "Y difumina suave con el pañuelo, sin borrar las plumitas."}, {"n": "Ala", "d": "El ala: primero las sombras entre pluma y pluma.", "m": "Luego un tono medio, con trazos a lo largo de cada pluma.", "l": "Estas plumas son las más claras: apenas un tono suave difuminado."}, {"n": "Plumas largas", "d": "Las plumas largas: primero lo más oscuro, entre pluma y pluma y hacia la cola.", "m": "Luego el tono medio, con trazos largos que bajan.", "l": "Y difumina con el pañuelo para unir los tonos."}, {"n": "Pata y rama", "d": "La pata y la rama: primero las sombras, debajo de la pata y en las grietas.", "m": "Luego el tono medio de la corteza, con trazos a lo largo de la rama.", "l": "Y un tono suave difuminado en el musgo."}], "fin": [["Brillos con la goma", "Por último, con la goma, saca los brillos: la orilla del pico, el brillo del ojo y las puntas de algunas plumas."]]});

/* Gatito atigrado: técnica del video (círculo y cuadrícula, ojos primero, bolígrafo blanco) */
PD({"id": "dgatito2", "k": "gato2", "lvl": 4, "cat": "Animales", "name": "Gatito atigrado", "time": "90 min", "lap": {"dark": ["#2E2E36", "Lápiz 8B"], "mid": ["#6E6E7A", "Lápiz 6B"], "base": ["#B9B9C0", "Lápiz HB"]}, "guia": "Empieza con un círculo grande para la cabeza. Encima, una cuadrícula suave: tres líneas acostadas y unas paradas. Las cajitas de la cuadrícula te dicen dónde va cada ojo y dónde va la nariz.", "lines": [["Los ojos", "Dentro de sus cajitas, los dos ojos: grandes y redondos. Adentro de cada uno, otro círculo para el iris. El de la derecha se ve más grande porque está más cerca."], ["La nariz y los bigotes", "Abajo, entre las líneas, la nariz como un triangulito con las puntas redondas. De ella baja la boca en forma de Y. A los lados, los puntitos de donde salen los bigotes."], ["Contorno de la cabeza", "Ahora el borde de la cabeza con trazos en zigzag, como pelitos, sin seguir el círculo exacto: arriba, a los lados y bajando al cuello."], ["Las orejas", "Las orejas grandes en punta: la de la izquierda más chica y la de la derecha grande. Adentro, unas líneas para los pelos largos."], ["Las rayas", "En la frente, el borde de las rayas oscuras del gatito atigrado, como llamitas que suben."]], "tones": [{"n": "Ojos", "b": 2, "d": "Como en el video, el sombreado empieza por los ojos con el lápiz más oscuro: la pupila bien negra y la orilla del ojo. Deja sin pintar el puntito de brillo.", "l": "Luego el iris con lápiz suave, más oscuro arriba y más claro abajo."}, {"n": "Nariz", "b": 2, "d": "La nariz: primero los orificios y la línea de la boca, bien oscuros.", "l": "Luego un tono suave en la nariz, dejando un brillo arriba."}, {"n": "Frente", "d": "La frente: rellena las rayas oscuras con trazos que suben, como el pelo.", "m": "Luego el tono medio entre las rayas.", "l": "Y lo claro con lápiz HB, casi sin apretar."}, {"n": "Orejas", "d": "Las orejas: primero el fondo oscuro y las orillas.", "m": "Luego los pelitos de adentro, con trazos largos hacia la punta.", "l": "Y los pelos claros, muy suaves."}, {"n": "Cara", "d": "La cara: primero las manchas oscuras de las mejillas y debajo de los ojos.", "m": "Luego el tono medio, con trazos que salen de la nariz hacia los lados.", "l": "Y lo claro: alrededor de la boca y el hocico casi blanco."}, {"n": "Cuello", "b": 2, "d": "El cuello: trazos largos que bajan, más oscuros a los lados.", "l": "Y unos trazos suaves para terminar."}], "fin": [["Bigotes con bolígrafo blanco", "Como en el video, el toque final es con bolígrafo blanco o con la goma en punta: los bigotes largos y los brillos de los ojos.", ["#FFFFFF", "Bolígrafo blanco"]]]});

/* Mural completo del pulpo pirata: hoja ancha */
PD({"id": "dmural", "k": "mural", "h": 200, "lvl": 5, "cat": "Animales", "name": "El mural del pulpo pirata", "time": "3 horas", "guia": "Esta hoja es ancha, como el mural. Empieza con formas de ayuda muy suaves: dos círculos arriba para los timones, un óvalo grande en medio para la cabeza del pulpo, un cuadrado a la izquierda para el cofre, una flecha para el ancla, dos óvalos para el búho y una línea de piso abajo para los corales.", "lines": [["El sombrero y la cabeza", "Empieza por el centro: el sombrero pirata con su calavera, y debajo la cabeza redonda del pulpo."], ["El ojo, el parche y el bigote", "En la cara: el ojo grande y redondo, el parche con su cinta y el bigote enroscado."], ["Los tentáculos", "Ahora los ocho tentáculos que se enroscan hacia los lados y hacia abajo, con las ventosas en la orilla."], ["El cofre", "A la izquierda, el cofre del tesoro: la caja con sus tablas, la tapa abierta y la cerradura."], ["Las perlas y las monedas", "Dentro del cofre, muchas perlas redondas. Y abajo, las monedas y perlas que se cayeron."], ["Los corales de la izquierda", "Detrás del cofre, los corales: ramas que se dividen como los dedos de una mano."], ["Los timones", "Arriba, los dos timones de barco: un círculo con rayos y las agarraderas alrededor."], ["La mariposa y el ancla", "La mariposa con sus cuatro alas, y a su lado el ancla con su cuerda enrollada."], ["El búho y el cartel", "A la derecha, el búho con sus ojos grandes y sus plumas, y arriba el cartelito."], ["Los corales de la derecha", "Por último, los corales de la derecha y las botellitas."]], "tones": [{"n": "Cara del pulpo", "b": 2, "d": "Ahora el sombreado. Como en el video del gato, empieza por el ojo: la pupila, el parche y el bigote, bien negros. Deja el brillo del ojo blanco.", "l": "Luego un tono suave alrededor del ojo."}, {"n": "Sombrero", "b": 2, "d": "El sombrero es negro: rellénalo con lápiz oscuro, sin tocar la calavera.", "l": "Luego la orilla dorada y la calavera, muy suaves."}, {"n": "Pulpo", "d": "El pulpo: primero las sombras debajo de cada tentáculo, donde se enroscan.", "m": "Luego el tono medio, con trazos que siguen la curva de cada tentáculo.", "l": "Y difumina suave con un pañuelo; las ventosas quedan blancas."}, {"n": "Cofre", "d": "El cofre: primero lo oscuro, adentro de la tapa y entre las tablas.", "m": "Luego la madera, con trazos a lo largo de cada tabla como la veta.", "l": "Y difumina el tono claro de las orillas doradas."}, {"n": "Tesoro", "b": 2, "d": "Las perlas y monedas: una sombrita debajo de cada una.", "l": "Y un tono suave, dejando un brillo blanco en cada perla."}, {"n": "Corales izquierda", "d": "Los corales de la izquierda: primero las sombras entre las ramas.", "m": "Luego el tono medio de cada rama, con trazos que suben.", "l": "Y difumina suave para que se vean redonditas."}, {"n": "Timones", "b": 2, "d": "Los timones: primero lo oscuro entre los rayos.", "l": "Luego un tono suave en la madera dorada."}, {"n": "Mariposa", "b": 2, "d": "La mariposa: las orillas negras de las alas y sus manchitas.", "l": "Luego un tono suave en el centro de las alas."}, {"n": "Ancla", "b": 2, "d": "El ancla es oscura: rellénala con trazos a lo largo, dejando la cuerda más clara.", "l": "Y un tono suave en la cuerda."}, {"n": "Búho y cartel", "b": 2, "d": "El búho: primero sus ojos y las manchitas oscuras de las plumas.", "l": "Luego un tono suave en todo el cuerpo y en el cartel."}, {"n": "Corales derecha", "d": "Los corales de la derecha: primero las sombras entre las ramas y las botellas.", "m": "Luego el tono medio de cada rama.", "l": "Y difumina suave para terminar el mural."}], "fin": [["Brillos con la goma", "Por último, con la goma, saca los brillos: las perlas, las monedas, el ojo del pulpo y las puntas de los corales."]]});

/* Retrato: técnica del video (óvalo y proporciones, grafito en polvo, goma) */
PD({"id": "dretrato", "k": "retrato", "h": 266.667, "lvl": 5, "cat": "Personas", "name": "Retrato junto al árbol", "time": "3 horas", "guia": "Para dibujar una persona, empieza muy suave: un óvalo para la cara y una línea en medio, de arriba abajo. Luego tres rayitas: a la mitad del óvalo van los ojos, más abajo la base de la nariz y luego la boca. Agrega una forma grande para el cabello, las líneas de los brazos y, atrás, el tronco y la copa del árbol.", "lines": [["El contorno de la cara", "Sobre el óvalo, dibuja el borde de la cara con una sola línea: baja por la mejilla de la derecha, da la vuelta en la barbilla y sube por la otra mejilla."], ["Los ojos", "En la línea de los ojos, dibuja los dos ojos como almendras. Adentro el iris redondo y la pupila. Luego las pestañas, una por una: en el ojo de la izquierda son largas y se van hacia afuera. Arriba, las dos cejas iguales, pelito por pelito: junto a la nariz casi parados y hacia la orilla cada vez más acostados."], ["La nariz", "Sobre la segunda rayita, la nariz: casi sin línea en el puente. Marca la aleta de un lado y los dos orificios, como pequeñas olas."], ["La boca", "En la última rayita, la boca: primero la línea donde se juntan los labios, de una esquina a la otra. Luego el labio de arriba, con su curva en medio, y el de abajo, redondo."], ["El cabello", "Ahora el cabello: primero el borde de la cabeza, junto al árbol. Luego líneas largas y sueltas, una por mechón: el chongo arriba y el pelo largo que cae a los lados."], ["Las manos y el hombro", "Las manos debajo de la barbilla: el dedo con su punta redonda, los brazos y la curva del hombro con el tirante de la blusa."], ["El tronco", "Atrás, los dos bordes del tronco y las ramas gruesas que salen hacia arriba y a los lados."], ["Las ramas y las hojas", "Alrededor de las ramas, el borde de la copa: una línea con ondas que marca dónde están los grupos de hojas."], ["El pasto", "Por último, el pasto abajo, con trazos cortos hacia arriba."]], "pre": [["Base: grafito en polvo", "Como en el video: con un pincel suave y un poco de grafito en polvo, pasa una capa ligera de tono en la cara, el cabello y los brazos. Así la piel se ve pareja antes de los detalles."]], "tones": [{"n": "Ojos", "b": 2, "d": "Ahora los detalles con lápiz. Primero los ojos: la pupila y las pestañas, bien oscuras, dejando un brillito blanco.", "l": "Luego el iris y la sombra suave debajo de las cejas."}, {"n": "Nariz y boca", "b": 2, "d": "La nariz y la boca: primero los orificios y la línea entre los labios.", "l": "Luego un tono suave en los labios, más oscuro el de arriba."}, {"n": "Cara", "b": 2, "d": "La cara: las sombras suaves a los lados de la nariz, debajo de la barbilla y en las mejillas.", "l": "Y difumina con el pincel, para que la piel se vea lisa."}, {"n": "Cabello", "d": "El cabello: primero lo más oscuro, entre los mechones y cerca de la cara.", "m": "Luego el tono medio, siguiendo la dirección del pelo.", "l": "Y deja los mechones claros casi blancos."}, {"n": "Manos y hombro", "b": 2, "d": "Las manos y el hombro: primero las sombras entre los dedos y el tirante.", "l": "Luego un tono suave en la piel."}, {"n": "Tronco", "d": "El tronco: primero las grietas oscuras de la corteza.", "m": "Luego el tono medio, con trazos a lo largo del tronco.", "l": "Y lo claro donde le da la luz."}, {"n": "Hojas", "d": "Las hojas: primero lo oscuro entre los grupos de hojas.", "m": "Luego el tono medio de cada hoja.", "l": "Y las hojas de afuera, muy claras."}, {"n": "Pasto", "b": 2, "d": "El pasto: trazos cortos y oscuros abajo.", "l": "Y trazos suaves que se desvanecen."}], "fin": [["Brillos con la goma", "Por último, con la goma en punta, saca los brillos: en los ojos, en los labios, en la nariz y en algunos mechones del cabello."]]});

PD({"id": "dperro", "k": "perro3", "lvl": 4, "cat": "Animales", "name": "El sabueso", "time": "80 min", "artist": true, "guia": "Un círculo grande para la cabeza y otro más chico adelante para el hocico. Un óvalo largo y chueco marca la oreja, y dos líneas bajan para el cuello y el pecho. Muy suave.", "lines": [["Contorno de la cabeza", "Sobre el círculo grande, dibuja el borde de arriba de la cabeza: la frente redonda que baja hacia atrás, por encima de la oreja."], ["El ojo", "Dentro de la cabeza, cerca de la frente, el ojo: una almendra pequeña. Adentro, el iris redondo y un puntito para el brillo."], ["La nariz", "En la punta del hocico, la nariz redondeada, y dentro una curva para el orificio."], ["Contorno del hocico", "Une la nariz con la cabeza: el borde de arriba del hocico, la barbilla y la quijada, que pasa por arriba de la otra oreja. Y la línea del labio, debajo de la nariz."], ["Detalles de la cara", "Ahora adentro: los puntitos de los bigotes en el hocico y unos trazos cortos que siguen el pelo de la frente y del hocico."], ["Contorno de la oreja", "La oreja larga cae desde arriba de la cabeza, como una hoja grande; su orilla de abajo se dobla un poquito. Debajo de la quijada, sin tocarla, se asoma la otra oreja: chiquita, como una hojita."], ["Pelo de la oreja", "Dentro de la oreja, unas líneas largas que siguen el pelo hacia abajo."], ["El cuello", "Desde la cabeza baja el cuello, ancho y fuerte, con algunos trazos que siguen el pelo."], ["El pecho", "Abajo, los lados del pecho y el borde de las dos manchas oscuras."]], "tones": [{"n": "Cabeza", "d": "Empieza el sombreado por la cabeza: primero lo más oscuro, el ojo, la nariz y la boca.", "m": "Ahora el tono medio de la frente y el hocico, con trazos cortos hacia atrás.", "l": "Y lo más clarito: el hocico y la frente donde da la luz, casi sin apretar."}, {"n": "Oreja", "d": "La oreja: primero sus partes más oscuras, el borde de abajo y la sombra que hace sobre el cuello.", "m": "Luego el tono medio, con trazos largos hacia abajo como el pelo.", "l": "Por último los brillos de la oreja, muy suaves."}, {"n": "Cuello", "d": "En el cuello, lo oscuro primero: los pliegues y la sombra bajo la oreja.", "m": "Después el tono medio siguiendo el pelo.", "l": "Y lo claro donde da la luz."}, {"n": "Pecho", "d": "El pecho: primero las manchas oscuras de los lados.", "m": "Luego los grises del pelo.", "l": "Y al final el pelo blanco, apenas tocando el papel."}], "fin": [["Los últimos detalles", "Repasa lo más oscuro: el ojo, la nariz y la orilla de la oreja. Con la goma en punta saca el brillito del ojo y de la nariz."]]});

PD({"id": "dpulpo", "k": "pulpo2", "h": 462.7, "lvl": 2, "cat": "Animales", "name": "El pulpo pirata", "time": "50 min", "artist": true, "guia": "Muy suave: un óvalo grande y ancho para el sombrero, y abajo un círculo para la cabeza del pulpo. Dos líneas en diagonal arriba para las espadas, y una forma de triángulo abajo para los tentáculos.", "lines": [["El sombrero", "Sobre el óvalo grande, el sombrero pirata: dos picos arriba, uno a cada lado, y el ala ancha que baja por los lados."], ["La calavera", "En medio del sombrero, la calavera con sus dos huesos cruzados abajo."], ["Las espadas", "Detrás del sombrero, una espada a cada lado: el mango largo y la guarda curva como una ese."], ["El pañuelo", "Debajo del sombrero, el pañuelo rojo que le cubre la cabeza, con su nudo a la derecha."], ["El parche y el ojo", "Un parche negro en un ojo, con su cinta, y el otro ojo redondo con un brillito."], ["La cabeza", "La cabeza del pulpo y su sonrisa tranquila."], ["Los tentáculos", "Abajo, los tentáculos que se doblan hacia los lados, con sus ventosas."]], "tones": [{"n": "Sombrero", "b": 2, "d": "Ahora el color: el sombrero negro, dejando blanca la calavera.", "l": "Y repasa sus orillas."}, {"n": "Espadas", "b": 2, "d": "Las espadas: el mango verde con rayas y la guarda dorada.", "l": "Y la hoja gris."}, {"n": "Pañuelo", "b": 2, "d": "El pañuelo rojo, más oscuro en los dobleces.", "l": "Y el rojo claro arriba."}, {"n": "Pulpo", "d": "El pulpo: primero el rosa más fuerte junto a las líneas.", "m": "Luego el rosa de toda la cabeza y los tentáculos.", "l": "Y las ventosas, blancas con puntitos."}, {"n": "Fondo", "d": "Al final el mar: primero lo azul oscuro abajo.", "m": "Luego el azul medio, con los pececitos.", "l": "Y el azul claro de arriba."}], "fin": [["Para terminar", "Repasa con negro todas las orillas para que el dibujo se vea bien marcado."]]});

PD({"id": "dguadalupe_lapiz", "k": "gua3l", "h": 710, "lvl": 5, "cat": "Personas", "name": "Virgen de Guadalupe a lápiz", "time": "2 horas", "artist": true, "guia": "Muy suave: un óvalo inclinado para la cara, porque la Virgen inclina la cabeza hacia la izquierda. Alrededor, un arco grande para el velo, y abajo un óvalo para las manos.", "lines": [["El contorno de la cara", "Sobre el óvalo, el borde de la cara: arriba donde empieza el pelo, la mejilla y la barbilla redonda."], ["Los ojos y las cejas", "Los ojos mirando hacia abajo, casi cerrados, con su párpado y el iris; arriba, las cejas finas."], ["La nariz y la boca", "La nariz larga con la curva de la punta, y la boca pequeña con sus dos labios."], ["El cabello", "El cabello largo con líneas que bajan a los dos lados de la cara, desde la raya de en medio."], ["El cuello y el broche", "El cuello, el cuello redondo de la túnica con su orilla, y el broche en medio."], ["El velo y el manto", "El velo que cubre la cabeza con su orilla, y el manto que cae por los lados hasta abajo."], ["Las manos", "Las manos juntas, rezando: cada dedo con su uña."], ["La túnica", "La túnica con sus flores en forma de remolino, y los puños de las mangas."], ["Las estrellas", "Sobre el manto, las estrellas de ocho picos."], ["Los rayos", "Por último, los rayos de sol: líneas rectas que salen de atrás hacia afuera."]], "tones": [{"n": "Cara y manos", "d": "Ahora el sombreado a lápiz: primero lo más oscuro de la piel, alrededor de los ojos, debajo de la nariz y entre los dedos.", "m": "Luego un gris suave en las mejillas, el cuello y las manos, con trazos cortos en diagonal.", "l": "Y deja casi blanco la frente, la nariz y la barbilla, donde da la luz."}, {"n": "Cabello", "d": "El cabello: apriétalo bien, casi negro, sobre todo junto a la cara.", "m": "Luego un gris medio siguiendo las líneas del pelo.", "l": "Y unos brillos suaves con la goma."}, {"n": "Túnica", "d": "La túnica: primero las sombras entre los pliegues y alrededor de las flores.", "m": "Luego un gris medio en toda la túnica.", "l": "Y los puños casi blancos."}, {"n": "Manto", "d": "El manto: primero lo más oscuro, junto al cabello y en los pliegues.", "m": "Luego un gris parejo con trazos largos.", "l": "Y lo claro donde le da la luz, dejando blancas las estrellas."}, {"n": "Rayos", "d": "Los rayos: primero rellena oscuro el espacio entre ellos.", "m": "Luego un gris suave en cada rayo.", "l": "Y deja clara la punta de cada rayo."}], "fin": [["Los últimos detalles", "Repasa con el lápiz más blando lo más oscuro: los ojos, la boca y el cabello. Con la goma en punta saca los brillos."]]});

PD({"id": "dcielo", "k": "cielo3", "h": 228.4, "lvl": 5, "cat": "Personas", "name": "Jesús mirando al cielo", "time": "90 min", "guia": "Muy suave: un óvalo inclinado para la cara, porque Jesús mira hacia arriba. Detrás, medio círculo grande para la luz, y abajo la línea de los hombros, que sube por los lados.", "lines": [["Las líneas de la cara", "Dentro del óvalo, una línea por el centro de la cara, inclinada. Cruzándola, la línea de los ojos, y más abajo dos rayitas: la base de la nariz y la boca."], ["El contorno de la cara", "Sobre el óvalo, el borde de la cara: la mejilla que baja hasta la barba."], ["Los ojos y las cejas", "Los ojos mirando hacia arriba, con el iris pegado al párpado de arriba, y las cejas arqueadas."], ["La nariz y la boca", "La nariz vista desde abajo, con sus orificios, y la boca un poco abierta bajo el bigote."], ["La barba", "La barba con trazos cortos que bajan siguiendo el pelo, hasta la barbilla."], ["El cabello", "El cabello largo y ondulado, con mechones que caen a los lados hasta los hombros."], ["El cuello", "El cuello largo, con la línea de la garganta."], ["La túnica y el manto", "La túnica con su cuello abierto y el manto sobre el hombro, con pliegues largos."], ["La luz y los rayos", "Detrás de la cabeza, el círculo de luz y los rayos que salen hacia afuera."], ["Las nubes", "Por último, las nubes a los lados, como bolitas redondas unas sobre otras."]], "tones": [{"n": "Cara", "d": "Ahora el sombreado a lápiz: lo más oscuro de la cara, debajo de las cejas, a los lados de la nariz y en el cuello.", "m": "Luego un gris suave en las mejillas y la frente.", "l": "Y deja casi blanca la luz en la frente, la nariz y la garganta."}, {"n": "Cabello y barba", "d": "El cabello y la barba: aprieta bien entre los mechones.", "m": "Luego el gris medio siguiendo cada mechón.", "l": "Y deja brillos claros en las ondas."}, {"n": "Túnica", "d": "La túnica: primero las sombras dentro de los pliegues.", "m": "Luego un gris parejo en la tela.", "l": "Y lo claro en el hombro, donde da la luz."}, {"n": "Fondo", "d": "El fondo: primero lo más oscuro entre los rayos y debajo de las nubes.", "m": "Luego un gris suave en los rayos y las nubes.", "l": "Y deja muy claro el círculo de luz detrás de la cabeza."}], "fin": [["Los últimos detalles", "Repasa con el lápiz más blando lo más oscuro: los ojos, la nariz y el cabello. Con la goma en punta saca los brillos de los ojos."]], "exact": true});

PD({"id": "djirafa", "k": "jirafa", "lvl": 3, "cat": "Animales", "name": "La jirafa", "time": "60 min", "exact": true, "guia": "Muy suave: un círculo grande para la cabeza y otro más chico adelante para el hocico. Arriba, dos rayitas para la oreja y el cuerno, y abajo dos líneas largas para el cuello.", "lines": [["El contorno de la cabeza", "Sobre los círculos, el borde de la cabeza: la oreja en punta, los dos cuernitos con su mechón, la frente, el hocico largo y la barbilla."], ["El ojo", "El ojo grande y redondo, con su brillito, el párpado y las arruguitas alrededor."], ["El hocico", "En la punta del hocico, la fosa de la nariz y la línea de la boca."], ["Las manchas de la cara", "Ahora las manchas de la cara, como piezas de rompecabezas: chiquitas cerca del ojo y más grandes hacia abajo."], ["El contorno del cuello", "Baja el cuello largo con dos líneas, una de cada lado."], ["Las manchas del cuello", "Y las manchas grandes del cuello, con sus orillas onduladas."]], "tones": [{"n": "Cabeza", "d": "Ahora el color: primero lo más oscuro, el ojo, la punta de los cuernos y las manchas cafés.", "m": "Luego el café claro de la cabeza y el hocico.", "l": "Y lo más clarito: la oreja, alrededor del ojo y la barbilla."}, {"n": "Cuello", "d": "El cuello: primero las manchas oscuras.", "m": "Luego el café dorado entre las manchas.", "l": "Y la luz en el borde del cuello."}, {"n": "Cielo", "b": 2, "d": "Al final el cielo: primero el azul.", "l": "Y las nubes blancas."}], "fin": [["Los últimos detalles", "Repasa el ojo bien oscuro y deja su brillito blanco."]]});

uro, abajo y en las orillas.", "m": "Luego el tono medio del agua, los corales y las algas.", "l": "Y por último los rayos de luz que bajan desde arriba."}], "fin": [["Los últimos detalles", "Repasa lo más oscuro: el ojo de la ballena, las ventanas del barco y las sombras de abajo."]]});

PD({"id": "dsagrado_lapiz", "k": "sagrado5g", "lvl": 5, "cat": "Personas", "name": "Sagrado Corazón de Jesús", "time": "2 horas", "exact": true, "h": 474.667, "guia": "Muy suave: un óvalo para la cabeza, una línea por el centro de la cara y otra a la altura de los ojos. Luego una curva para los hombros, una línea por el centro del cuerpo, dos líneas para los lados del manto y un óvalo para el corazón.", "lines": [["Los ojos y las cejas", "Sobre la línea de los ojos, dibuja los dos ojos con el iris redondo y la pupila, el pliegue de arriba y las cejas con rayitas que siguen el pelo."], ["La nariz", "Baja por el centro con la nariz: una línea larga por un lado, la punta redondita y las alas a los lados."], ["El bigote, la boca y la barba", "Debajo de la nariz, el bigote y la boca. Luego la barba con muchas rayitas que siguen el pelo, hasta la barbilla."], ["El cabello", "El cabello largo que cae a los lados, con raya en medio. Dibuja los mechones ondulados hasta los hombros y los rizos de las puntas."], ["El cuello y el escote", "El cuello y el escote redondo de la túnica, con su orilla doble."], ["Las manos", "La mano levantada, con dos dedos hacia arriba, y la otra mano que señala el corazón. Primero la orilla y luego los nudillos y las uñas."], ["El corazón", "En medio del pecho, el corazón con la corona de espinas, las llamas de arriba y la cruz."], ["Los rayos de luz", "Alrededor del corazón, las líneas rectas de la luz, como un sol."], ["El manto de este lado", "Del lado izquierdo, el manto que cae desde el hombro, con la manga ancha y sus pliegues."], ["El manto del otro lado", "Del lado derecho, el manto con la otra manga y sus pliegues."], ["La túnica y el manto de abajo", "Por último la túnica de en medio y el manto que cruza por abajo de lado a lado, con sus pliegues."]], "tones": [{"n": "Cabello y barba", "d": "Ahora el sombreado a lápiz: empieza por lo más oscuro del cabello y de la barba, entre los mechones.", "m": "Luego el tono medio de todo el cabello y la barba, siguiendo la dirección del pelo.", "l": "Y lo más clarito: los brillos del cabello, casi sin apretar."}, {"n": "Cara y manos", "d": "La cara y las manos: primero lo más oscuro, los ojos, las fosas de la nariz y la boca.", "m": "Luego las sombras suaves: a los lados de la nariz, bajo las cejas y entre los dedos.", "l": "Y un tono muy clarito en toda la piel. Deja blancos los brillos de la frente y la nariz."}, {"n": "Corazón", "d": "El corazón: primero lo más oscuro, el corazón y la corona de espinas.", "m": "Luego el tono medio de las llamas y de la cruz.", "l": "Y lo más claro: el brillo del corazón y la luz de las llamas."}, {"n": "Ropa", "d": "La ropa: primero los pliegues más hondos del manto.", "m": "Luego el tono medio de todo el manto.", "l": "Y por último la túnica, muy clarita, con la luz que sale del corazón."}], "fin": [["Los últimos detalles", "Repasa lo más oscuro: las pupilas, la línea de la boca, el contorno del corazón y la corona de espinas. Con la goma saca los brillos de los ojos y la luz alrededor del corazón."]]});

PD({"id": "ddivina", "k": "divina_c", "lvl": 5, "cat": "Personas", "name": "Divina Misericordia", "time": "2 horas", "exact": true, "h": 650.667, "guia": "Muy suave: un óvalo para la cabeza, con una línea por el centro de la cara y otra para los ojos. Una curva para los hombros y una línea larga hasta los pies. Dos óvalos para las mangas y dos chiquitos para las manos. Un circulito en el pecho, de donde salen dos líneas para los rayos, y abajo una línea para las letras.", "lines": [["Los ojos y las cejas", "Sobre la línea de los ojos, dibuja los dos ojos con su iris redondo y la pupila, el pliegue de arriba y las cejas."], ["La nariz", "Baja por el centro con la nariz: una línea larga por un lado, la punta y las alas a los lados."], ["La boca, el bigote y la barba", "Debajo de la nariz, el bigote y la boca con una sonrisa suave. Luego las mejillas y la barba con rayitas que siguen el pelo, hasta la barbilla en dos puntas."], ["El cabello y la aureola", "El cabello largo con raya en medio, que cae en ondas hasta los hombros. Alrededor de la cabeza, un círculo muy suave: la aureola."], ["El cuello", "El cuello y el escote redondo de la túnica, con su orilla doble."], ["Las manos", "La mano levantada que bendice, con su brazo. Luego la otra mano sobre el pecho, con los dedos que señalan el corazón."], ["La manga de este lado", "La manga ancha que cuelga del brazo levantado, con sus pliegues hondos."], ["La manga del otro lado", "Del otro lado, el hombro y la manga larga que cae, con sus pliegues."], ["La túnica", "La túnica: los pliegues del pecho, el cinto en la cintura y los pliegues largos que bajan hasta los pies. En medio se pierden con la luz."], ["Los pies", "Abajo, los pies descalzos que se asoman bajo la túnica, con sus deditos."], ["La luz del corazón", "Del corazón, debajo de los dedos, salen rayitas cortas en todas direcciones, como una estrella."], ["Los rayos de luz", "Ahora los rayos grandes: muchas líneas rectas que salen del corazón y se abren hacia abajo. Arriba se ven fuertes, en medio se pierden con la luz y abajo vuelven a aparecer."], ["Las letras", "Abajo, con letra bonita: Jesús, en Ti confío. Dibuja la orilla de cada letra, una por una."], ["El piso", "Por último el piso de piedras: rectángulos chuecos, uno junto a otro."]], "tones": [{"n": "Cabello y barba", "d": "Ahora el color: primero el café más oscuro del cabello y de la barba, entre los mechones.", "m": "Luego el café de todo el cabello, siguiendo las ondas.", "l": "Y lo más clarito: los brillos dorados del cabello."}, {"n": "Cara y manos", "d": "La piel: primero lo más oscuro, los ojos, debajo de la nariz y entre los dedos.", "m": "Luego el color de la piel en la cara, el cuello, las manos y los pies.", "l": "Y un tono muy clarito en toda la piel. Deja blancos los brillos."}, {"n": "La túnica", "d": "La túnica: primero los pliegues más hondos de las mangas y de abajo.", "m": "Luego el color crema de la túnica, y donde le pega la luz, rojo de un lado y azul del otro.", "l": "Y lo más claro: el pecho, donde brilla la luz."}, {"n": "La luz y el fondo", "d": "Ahora el fondo: azul muy oscuro alrededor y el piso, y deja claritos los rayos de luz.", "m": "Luego los rayos: rojo de un lado y azul pálido del otro.", "l": "Y al final lo más clarito: la luz alrededor de la cabeza, el brillo del corazón y las letras blancas."}], "fin": [["Los últimos detalles", "Repasa lo más oscuro: las pupilas, la línea de la boca y la orilla de las letras. Deja muy blanco el brillo del corazón."]]});

const effT=d=>d&&d.img&&!d.img[st.tech]?'lapiz':st.tech;
function fasePaso(d,i){const s=d.steps[i-1];if(!s)return 'tono';if(!s.m&&!s.T)return i===1?'guias':'lineas';if(/^para terminar/i.test(s.t))return 'final';return 'tono'}
function faseLab(f,medio){return f==='guias'?'Guías':f==='lineas'?'Líneas':f==='final'?'Final':medio==='lapiz'?'Sombreado':'Color'}
function stepInfo(d,k){
  const T=TECH[effT(d)],s=d.steps[k-1];
  if(d.img){const tone=!!s.m,x=typeof s.x==='string'?s.x:(s.x[effT(d)]||s.x.lapiz);return{tone,t:tone&&!s.t.includes(':')&&T.pre[s.m]&&T.pre[s.m].toLowerCase()!==s.t.toLowerCase()?`${T.pre[s.m]}: ${s.t}`:s.t,x,s}}
  const tone=!!s.T;
  return tone?{tone,t:`${T.pre[s.m]}: ${s.t}`,x:s.x+' '+T.how[s.m],s}:{tone,t:s.t,x:s.x,s};
}
const PRES={dark:3,mid:2,detail:2,base:1,light:1};
function chipsPaso(d,si,f,medio){

  else if(TECH[tk].chip&&TECH[tk].chip[s.m])a=`<span class="mat"><i style="background:#8A8A96"></i>${TECH[tk].chip[s.m]}</span>`;
  const p=PRES[s.m]||1,pt=['','Presión suave','Presión media','Presión fuerte'][p];
  return a+`<span class="mat presion"><i aria-hidden="true">${[1,2,3].map(j=>`<b class="${j<=p?'on':''}" style="height:${4+j*3}px"></b>`).join('')}</i>${pt}</span>`;

/* zoom propio del dibujo: los botones nunca se mueven ni se salen de la pantalla */
const Z={s:1,x:0,y:0};
function zApply(){
  const p=$('#zpaper'),z=$('#zoomer');if(!p||!z)return;
  const W=p.clientWidth,H=p.clientHeight;
  Z.s=Math.max(1,Math.min(5,Z.s));
  Z.x=Math.min(0,Math.max(W-W*Z.s,Z.x));Z.y=Math.min(0,Math.max(H-H*Z.s,Z.y));
  z.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
  const f=$('#bFit');if(f)f.hidden=Z.s<=1.01;
}
function zTo(ns,cx,cy){const p=$('#zpaper');if(!p)return;const W=p.clientWidth,H=p.clientHeight;if(cx==null){cx=W/2;cy=H/2}
  ns=Math.max(1,Math.min(5,ns));Z.x=cx-(cx-Z.x)*ns/Z.s;Z.y=cy-(cy-Z.y)*ns/Z.s;Z.s=ns;zApply()}
function zReset(){Z.s=1;Z.x=0;Z.y=0;zApply()}
function zBind(){
  const p=$('#zpaper');if(!p)return;const pts=new Map();let g=null,lastTap=0;
  const rel=e=>{const r=p.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  p.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;p.setPointerCapture(e.pointerId);pts.set(e.pointerId,rel(e));g=null;
    if(pts.size===1){const t=Date.now();if(t-lastTap<300){Z.s>1.01?zReset():zTo(2.5,...rel(e))}lastTap=t}});

function festejo(){
  const d=cur(),g=GDE[d.id]||{name:d.name},v=versionActual(),o=otraVersion(),min=Math.round((Date.now()-st.t0)/60000);
  const f=document.createElement('div');f.className='festejo';f.setAttribute('role','dialog');f.setAttribute('aria-modal','true');f.setAttribute('aria-labelledby','fTit');
  f.innerHTML=`<canvas aria-hidden="true"></canvas><div class="f-caja">
    <div class="f-hoja"><img src="${thumb(d.id,effT(d))}" alt="${esc(g.name)}, terminado"></div>
    <p class="f-mano" aria-hidden="true">¡Muy bien!</p>
    <h2 id="fTit">¡Terminaste ${esc(g.name.charAt(0).toLowerCase()+g.name.slice(1))}!</h2>
    <p>Hiciste los ${d.steps.length} pasos${min>=2?` en unos ${min} minutos`:''}.</p>
    <div class="f-acc">${o?`<button class="btn" data-a="otra-version">Hacerlo ${MEDIO[o.m].toLowerCase()}</button>`:''}<button class="btn${o?' sec':''}" data-a="cerrar-festejo">Ver mi dibujo</button><button class="btn sec" data-a="festejo-inicio">Elegir otro dibujo</button></div>
  </div>`;

  if(!RM())confeti(f.querySelector('canvas'));

function confeti(cv){
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const c=cv.getContext('2d');if(!c)return;c.scale(dpr,dpr);
  const col=['#F25F3F','#FFC23A','#2F63E0','#3BB273','#B05BD8','#1F2330'],P=[];
  for(let i=0;i<120;i++)P.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:5+Math.random()*7,h:3+Math.random()*4,c:col[i%col.length]});
  const t0=performance.now();
  const fr=t=>{
    if(!cv.isConnected)return;const e=(t-t0)/1000;c.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=Math.max(0,1-e/3.2);c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()});
    if(e<3.3)requestAnimationFrame(fr);else c.clearRect(0,0,W,H);
  };
  requestAnimationFrame(fr);
}

/* ---------- clics ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a;
  if(a==='cerrar-capa'){if(e.target===b||b.tagName==='BUTTON')cerrarCapa();return}
  if(a==='home'){e.preventDefault();if(st.view==='studio')salir();else window.scrollTo({top:0,behavior:RM()?'auto':'smooth'});return}
  if(a==='open'){open(b.dataset.id,b.dataset.tk);return}
  if(a==='seguir'&&st.last){open(st.last.id,st.last.tk,st.last.k);return}
  if(a==='ir-galeria'){const g=$('#galeria');if(g)g.scrollIntoView({behavior:RM()?'auto':'smooth',block:'start'});return}
  if(a==='cat'){st.cat=b.dataset.c;$$('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.c===st.cat)));pintarObras();return}
  if(a==='ver'){const g=GRUPOS.find(x=>x.key===b.dataset.g);if(!g)return;st.ver[g.key]=+b.dataset.i;save();const art=b.closest('.obra');if(art)art.outerHTML=obraHTML(g);return}
  if(a==='voz'){toggleVoz();return}
  if(a==='mus'){toggleMus();return}
  if(a==='ajustes'){abrirAjustes();return}
  if(a==='probar-voz'){speak('Hola, vamos a dibujar juntos. Primero, traza un óvalo suave, casi sin apretar el lápiz.',true);return}
  if(a==='mood'){SND.mood=b.dataset.m;SND.music=true;stopMusic();setTimeout(startMusic,450);saveSnd();syncSonido();$$('[data-a="mood"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.m===SND.mood)));return}
  if(a==='tema'){st.tema=b.dataset.t;save();aplicarTema();$$('[data-a="tema"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.t===st.tema)));return}
  if(a==='vel'){SPEED=+b.dataset.v;try{localStorage.setItem('trazo-spd',String(SPEED))}catch(err){}$$('[data-a="vel"]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.v===SPEED)));if(st.view==='studio')replay();return}
  if(st.view!=='studio')return;
  if(a==='cerrar'){salir()}
  else if(a==='next')next();
  else if(a==='prev')prev();
  else if(a==='oir')speak(spoken(),true);
  else if(a==='go'){st.k=+b.dataset.k;st.fin=false;cerrarCapa(true);upd(true)}

  else if(a==='full'){cerrarCapa(true);toggleFull()}
  else if(a==='zin')zTo(Z.s*1.5);
  else if(a==='zout')zTo(Z.s/1.5);
  else if(a==='zfit')zReset();
  else if(a==='pause')setPaused(!PAUSED);
  else if(a==='replay')replay();

  else if(a==='cerrar-festejo'){const f=$('.festejo');if(f)f.remove()}
  else if(a==='festejo-inicio'){const f=$('.festejo');if(f)f.remove();salir()}
  else if(a==='otra-version'){const o=otraVersion(),f=$('.festejo');if(f)f.remove();if(o){const g=GDE[st.id];cambiarVersion(g.vers.indexOf(o));st.k=1;st.fin=false;st.t0=Date.now();upd(true)}}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;pintarObras()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(CAPAS.innerHTML){cerrarCapa();return}
    const f=$('.festejo');if(f){f.remove();return}
    if(ENFOQUE){setEnfoque(false);return}
  }
  if(st.view!=='studio'||CAPAS.innerHTML||$('.festejo')||e.altKey||e.ctrlKey||e.metaKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key===' '&&!/BUTTON/.test(e.target.tagName)){e.preventDefault();setPaused(!PAUSED);return}
  if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();
});
addEventListener('resize',()=>{if(st.view==='studio'){zApply();ajustarLista()}});
addEventListener('scroll',()=>{const b=$('#barra');if(b)b.classList.toggle('con-borde',scrollY>4)},{passive:true});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&st.view==='studio'&&!PAUSED)stopSpeak();
  if(!document.hidden&&st.view==='studio')pantallaEncendida(true);
});

/* botones de ícono: el nombre también como globo de ayuda al pasar el ratón */
new MutationObserver(()=>{$$('.ib[aria-label]:not([title]),.cb[aria-label]:not([title])').forEach(b=>b.title=b.getAttribute('aria-label'))}).observe(document.body,{childList:true,subtree:true});
/* ---------- arranque ---------- */
aplicarTema();
$('#bVoz').innerHTML=IC.voz;$('#bMus').innerHTML=IC.mus;$('#bAju').innerHTML=IC.aju;
syncSonido();
home();
if(location.hash.startsWith('#dibujo-'))ruta();

</script>
